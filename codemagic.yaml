workflows:
  ios-unsigned:
    name: Folia iOS unsigned
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      xcode: latest
      vars:
        XCODE_PROJECT: "Folia.xcodeproj"
        XCODE_SCHEME: "Folia"
    scripts:
      - name: xcodebuild version
        script: xcodebuild -version
      - name: install xcodegen
        script: |
          set -e
          if ! command -v xcodegen >/dev/null 2>&1; then
            brew install xcodegen
          fi
          xcodegen --version
      - name: generate xcode project
        script: |
          set -e
          cd "$CM_BUILD_DIR"
          xcodegen generate
          ls -d Folia.xcodeproj
      - name: build unsigned app
        script: |
          set -e
          cd "$CM_BUILD_DIR"
          xcodebuild \
            -project "$XCODE_PROJECT" \
            -scheme "$XCODE_SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$CM_BUILD_DIR/build" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_ENTITLEMENTS="" \
            build 2>&1 | tee /tmp/xcodebuild.log
      - name: wrap into ipa
        script: |
          set -e
          cd "$CM_BUILD_DIR/build/Build/Products/Release-iphoneos"
          rm -rf Payload
          mkdir -p Payload
          cp -R Folia.app Payload/
          zip -qry Folia-unsigned.ipa Payload
          ls -lh Folia-unsigned.ipa
    artifacts:
      - build/Build/Products/Release-iphoneos/Folia-unsigned.ipa
      - /tmp/xcodebuild.log

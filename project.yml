name: Folia
options:
  bundleIdPrefix: app.folia
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
  groupSortPosition: top

targets:
  Folia:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: Folia/App
      - path: Folia/Web
      - path: Folia/Views
      - path: Folia/Resources/Assets.xcassets
        buildPhase: resources
      - path: Folia/www
        type: folder
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.folia.web
        PRODUCT_NAME: Folia
        MARKETING_VERSION: "2.0.8"
        CURRENT_PROJECT_VERSION: "208"
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        INFOPLIST_FILE: Folia/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: ""
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        SUPPORTS_MACCATALYST: NO
        SWIFT_EMIT_LOC_STRINGS: YES
        SWIFT_INSTALL_OBJC_HEADER: NO
        ARCHS: arm64
        ONLY_ACTIVE_ARCH: NO
        SWIFT_COMPILATION_MODE: wholemodule
        ENABLE_BITCODE: NO

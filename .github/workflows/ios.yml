name: Build iOS ipa

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'ios-native/**'
      - '.github/workflows/ios.yml'

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: ios-native
        run: xcodegen generate

      - name: Show generated project
        run: ls -la ios-native/

      - name: Archive unsigned
        id: archive
        working-directory: ios-native
        continue-on-error: true
        run: |
          set -o pipefail
          xcodebuild -project FoliaNative.xcodeproj \
            -scheme FoliaNative \
            -configuration Release \
            -archivePath "$PWD/out.xcarchive" \
            archive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_ENTITLEMENTS="" \
            2>&1 | tee build.log

      - name: Surface compile errors
        if: steps.archive.outcome == 'failure'
        working-directory: ios-native
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          grep -E '\.swift:[0-9]+:[0-9]+: (error|warning|note):|^\*\* .* (FAILED|error)' build.log > errors.txt || true
          if [ ! -s errors.txt ]; then tail -n 80 build.log > errors.txt; fi
          # Write the diagnostics into a check annotation so they are readable without auth.
          while IFS= read -r line; do
            echo "::error::$line"
          done < errors.txt
          cat errors.txt
          exit 1

      - name: Package as ipa
        working-directory: ios-native
        run: |
          APP_PATH=$(find . -type d -name '*.app' -path '*Products/Applications*' | head -n 1)
          echo "App found at: $APP_PATH"
          mkdir Payload
          cp -r "$APP_PATH" Payload/
          zip -r App-unsigned.ipa Payload

      - name: Upload ipa artifact
        uses: actions/upload-artifact@v4
        with:
          name: App-unsigned
          path: ios-native/App-unsigned.ipa

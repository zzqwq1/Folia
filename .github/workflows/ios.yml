name: Build iOS ipa

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: ios-native
        run: xcodegen generate

      - name: Show generated project
        run: ls -la ios-native/

      - name: Archive unsigned
        working-directory: ios-native
        run: |
          set -e
          xcodebuild -project FoliaNative.xcodeproj \
            -scheme FoliaNative \
            -configuration Release \
            -archivePath "$PWD/out.xcarchive" \
            archive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_ENTITLEMENTS=""

      - name: Package as ipa
        working-directory: ios-native
        run: |
          APP_PATH=$(find . -type d -name '*.app' -path '*Products/Applications*' | head -n 1)
          echo "App found at: $APP_PATH"
          mkdir Payload
          cp -r "$APP_PATH" Payload/
          zip -r App-unsigned.ipa Payload

      - name: Upload ipa artifact
        uses: actions/upload-artifact@v4
        with:
          name: App-unsigned
          path: ios-native/App-unsigned.ipa

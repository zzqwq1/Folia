name: Build iOS ipa

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'ios-native/**'
      - '.github/workflows/ios.yml'
      - 'vite.config.ts'
      - 'package.json'
      - 'package-lock.json'
      - 'index.html'
      - 'src/**'
      - 'public/**'

# 发布 ipa 到 Release 需要 contents: write，否则 GITHUB_TOKEN 默认 read-only 时 gh release create 会 403。
permissions:
  contents: write
  checks: write

# 同一分支上新提交会取消还在跑的旧构建，避免排队和重复产出。
concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # package.json engines 要求 node >=24；构建前端（原版 1.8.5 界面 + iOS 本地 API 代理 env）。
      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Build frontend (iOS)
        run: npm run build
        env:
          IOS_BUILD: '1'
          VITE_NETEASE_API_BASE: 'http://127.0.0.1:48231/netease'
          VITE_QQ_API_BASE: 'http://127.0.0.1:48231/qq'
          VITE_KUGOU_API_BASE: 'http://127.0.0.1:48231/kugou'

      # dist 作为 folder reference 打进 app bundle（project.yml resources 引用 ios-native/dist）。
      - name: Copy dist into app bundle source
        run: mkdir -p ios-native/dist && cp -r dist/* ios-native/dist/

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: ios-native
        run: xcodegen generate

      - name: Archive unsigned
        id: archive
        working-directory: ios-native
        continue-on-error: true
        run: |
          set -o pipefail
          xcodebuild -project FoliaNative.xcodeproj \
            -scheme FoliaNative \
            -configuration Release \
            -archivePath "$PWD/out.xcarchive" \
            archive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_ENTITLEMENTS="" \
            | tee build.log

      # 失败时把 .swift 的诊断行写成 check-run 注解。Actions 日志页是前端渲染、artifact 下载要 token，
      # 但注解和 check-run API 是公开可读的，这样没有 Mac / 没登录也能看到确切错误。
      - name: Surface compile errors
        if: steps.archive.outcome == 'failure'
        working-directory: ios-native
        run: |
          set -e
          grep -E '\.swift:[0-9]+:[0-9]+: (error|warning|note):|^\*\* .* (FAILED|error)' build.log > errors.txt || true
          if [ ! -s errors.txt ]; then tail -n 80 build.log > errors.txt; fi
          while IFS= read -r line; do
            echo "::error::$line"
          done < errors.txt
          cat errors.txt
          exit 1

      # 把关键构建事实通过 ::notice:: 写进 check-run 注解（公开可读），
      # 便于在没有 Mac / 不登录的情况下排查资源没进包的问题。
      - name: Inspect build output
        if: always()
        working-directory: ios-native
        run: |
          set -e
          echo "::notice title=inspect::pbx-buildfile-xcassets=$(grep -c 'Assets.xcassets in Resources' FoliaNative.xcodeproj/project.pbxproj || true)"
          echo "::notice title=inspect::pbx-resources-phase=$(grep -c 'PBXResourcesBuildPhase' FoliaNative.xcodeproj/project.pbxproj || true)"
          echo "::notice title=inspect::pbx-embed-script=$(grep -ci 'Embed web dist' FoliaNative.xcodeproj/project.pbxproj || true)"
          echo "::notice title=inspect::pbx-xcassets-keys=$(grep -n 'Assets.xcassets' FoliaNative.xcodeproj/project.pbxproj | head -n 12 | tr '\n' ';')"
          echo "::notice title=inspect::dist-file-count=$(ls dist 2>/dev/null | wc -l | tr -d ' ')"
          APP=$(find . -type d -name '*.app' -path '*Products/Applications*' | head -n 1)
          echo "::notice title=inspect::app-path=$APP"
          if [ -n "$APP" ]; then
            echo "::notice title=inspect::app-contents=$(ls "$APP" | tr '\n' ' ')"
            echo "::notice title=inspect::app-dist-size=$(du -sh "$APP/dist" 2>/dev/null | cut -f1 || echo none)"
            echo "::notice title=inspect::app-assets-car=$(ls "$APP/Assets.car" >/dev/null 2>&1 && echo yes || echo no)"
            echo "::notice title=inspect::app-icon-name=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIcons:CFBundlePrimaryIcon:CFBundleIconName' "$APP/Info.plist" 2>/dev/null || echo none)"
          fi

      - name: Package as ipa
        working-directory: ios-native
        run: |
          APP_PATH=$(find . -type d -name '*.app' -path '*Products/Applications*' | head -n 1)
          echo "App found at: $APP_PATH"
          mkdir Payload
          cp -r "$APP_PATH" Payload/
          zip -r App-unsigned.ipa Payload

      - name: Upload ipa artifact
        uses: actions/upload-artifact@v4
        with:
          name: App-unsigned
          path: ios-native/App-unsigned.ipa
          if-no-files-found: error

      # 把未签名 ipa 发布到 GitHub Release（保留最新一个），
      # 方便全能签等签名工具直接下载，签名后即可装到 iPhone。
      - name: Publish ipa to GitHub Release
        run: |
          gh release delete nightly-unsigned --yes 2>&1 || true
          if ! gh release create nightly-unsigned ios-native/App-unsigned.ipa \
              --title "未签名构建 $(date '+%Y-%m-%d %H:%M')" \
              --notes "自动构建的未签名 ipa，可用全能签等签名工具签名后安装到 iPhone。bundle id: app.folia.major.native" \
              --prerelease > release-create.log 2>&1; then
            sed 's/^/::error::/' release-create.log
            exit 1
          fi
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: ios-native/build.log
          if-no-files-found: ignore

# 在没有 Mac 的情况下，用 GitHub 的 macOS runner 编译出未签名 IPA。
#
# 用途：本地是 Windows，无法跑 xcodebuild；这个 workflow 提供一条可复现的 iOS 构建通道。
# 产物是**未签名** IPA，需要你自己用签名服务签名后才能安装。
#
# 手动触发：仓库 Actions -> "iOS 未签名构建" -> Run workflow
name: iOS 未签名构建

on:
  workflow_dispatch:
    inputs:
      configuration:
        description: "构建配置"
        required: false
        default: "Release"
        type: choice
        options:
          - Release
          - Debug

jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 40
    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 选择 Xcode
        run: sudo xcode-select -s /Applications/Xcode_15.4.app || sudo xcode-select -s /Applications/Xcode.app

      - name: 安装前端依赖
        run: npm ci --no-audit --no-fund

      - name: 构建前端资源
        run: |
          # 1.7.6 发布包的做法：把 dist 一起打进 App（所以体积 10MB+）。
          # 页面仍由 capacitor 的 server.url 远程加载，包内资源是发布形态的一部分。
          set -euo pipefail
          npm run build
          test -f dist/index.html
          du -sh dist

      - name: 准备 web 资源目录
        run: |
          set -euo pipefail
          rm -rf ios/App/App/public
          mkdir -p ios/App/App/public
          cp -R dist/. ios/App/App/public/
          cat > ios/App/App/capacitor.config.json <<'JSON'
          {
            "appId": "app.folia.major",
            "appName": "Folia",
            "webDir": "public",
            "server": { "url": "https://app.folia-api.top", "cleartext": false }
          }
          JSON
          cat > ios/App/App/config.xml <<'XML'
          <?xml version='1.0' encoding='utf-8'?>
          <widget version="1.0.0" xmlns="http://www.w3.org/ns/widgets" xmlns:cdv="http://cordova.apache.org/ns/1.0">
            <name>Folia</name>
          </widget>
          XML
          du -sh ios/App/App/public

      - name: 构建未签名 archive
        run: |
          # 不再用 `| tail` 截断输出：编译错误在日志中段，截断后定位不到。
          # 完整日志写文件，失败时把 error: 行和它后面几行一起打出来。
          set +e
          cd ios/App
          xcodebuild \
            -project App.xcodeproj \
            -scheme App \
            -configuration "${{ inputs.configuration }}" \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            archive > "$RUNNER_TEMP/build.log" 2>&1
          status=$?
          echo "xcodebuild exit=$status"
          if [ $status -ne 0 ]; then
            echo "===== 编译错误 ====="
            grep -n -A 4 "error:" "$RUNNER_TEMP/build.log" | head -n 120
            echo "===== 日志末尾 ====="
            tail -n 30 "$RUNNER_TEMP/build.log"
            exit $status
          fi
          tail -n 20 "$RUNNER_TEMP/build.log"

      - name: 打包成 IPA（未签名）
        run: |
          set -euo pipefail
          APP_PATH="$RUNNER_TEMP/App.xcarchive/Products/Applications/App.app"
          test -d "$APP_PATH"
          mkdir -p "$RUNNER_TEMP/Payload"
          cp -R "$APP_PATH" "$RUNNER_TEMP/Payload/"
          cd "$RUNNER_TEMP"
          zip -r folia-unsigned.ipa Payload
          ls -lh folia-unsigned.ipa

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: folia-unsigned-ipa
          path: ${{ runner.temp }}/folia-unsigned.ipa
          if-no-files-found: error

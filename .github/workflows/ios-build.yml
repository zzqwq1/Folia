name: Build unsigned IPA

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Install xcodegen
        run: |
          brew install xcodegen || true
          xcodegen --version

      - name: Generate Xcode project
        working-directory: ios-native
        run: |
          xcodegen generate
          ls -la

      - name: Build unsigned app
        run: |
          set -e
          echo "PWD=$(pwd)"
          xcodebuild \
            -project "ios-native/FoliaNative.xcodeproj" \
            -scheme "FoliaNative" \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$GITHUB_WORKSPACE/build" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_ENTITLEMENTS="" \
            build
          echo "--- products ---"
          ls -la "$GITHUB_WORKSPACE/build/Build/Products/Release-iphoneos"

      - name: Wrap into IPA
        run: |
          set -e
          cd "$GITHUB_WORKSPACE/build/Build/Products/Release-iphoneos"
          rm -rf Payload
          mkdir -p Payload
          cp -R FoliaNative.app Payload/
          zip -qry Folia-unsigned.ipa Payload
          ls -lh Folia-unsigned.ipa

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: Folia-unsigned-ipa
          path: build/Build/Products/Release-iphoneos/Folia-unsigned.ipa
          if-no-files-found: error

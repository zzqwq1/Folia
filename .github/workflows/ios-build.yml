name: Build unsigned IPA

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Build (project in repo root)
        run: |
          set -o pipefail
          xcodebuild \
            -project "Folia.xcodeproj" \
            -scheme "Folia" \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$GITHUB_WORKSPACE/build" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_ENTITLEMENTS="" \
            build 2>&1 | tee /tmp/xcodebuild.log

      - name: Show errors on failure
        if: failure()
        run: |
          echo "=== ERROR LINES ==="
          grep -nE "error:|error " /tmp/xcodebuild.log | head -n 60 || true
          echo "=== END ==="

      - name: Wrap into IPA
        run: |
          set -e
          cd "$GITHUB_WORKSPACE/build/Build/Products/Release-iphoneos"
          rm -rf Payload
          mkdir -p Payload
          cp -R Folia.app Payload/
          zip -qry Folia-unsigned.ipa Payload
          ls -lh Folia-unsigned.ipa

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: Folia-unsigned-ipa
          path: build/Build/Products/Release-iphoneos/Folia-unsigned.ipa
          if-no-files-found: error

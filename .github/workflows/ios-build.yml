name: Build unsigned IPA

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Show toolchain
        run: |
          xcodebuild -version
          xcrun swift --version

      - name: Install xcodegen
        run: |
          if ! command -v xcodegen >/dev/null 2>&1; then
            brew install xcodegen
          fi
          xcodegen --version

      - name: Verify web assets
        run: |
          test -f Folia/www/index.html
          echo "www files: $(find Folia/www -type f | wc -l)"
          du -sh Folia/www
          # 离线副本要能被 file:// 直接打开：任何根绝对路径（="/..." / "/assets/..."）
          # 在 file:// 下都会解析到磁盘根，主 bundle 直接 404，回退出来就是一片白。
          bad_html=$(grep -cE '(href|src)="/' Folia/www/index.html || true)
          echo "index.html root-absolute refs: $bad_html"
          test "$bad_html" -eq 0
          bad_js=$(grep -rlE '"/assets/' Folia/www/assets --include='*.js' --include='*.css' | wc -l)
          echo "assets files with root-absolute refs: $bad_js"
          test "$bad_js" -eq 0

      - name: Generate Xcode project
        run: |
          xcodegen generate
          ls -d Folia.xcodeproj

      # 同一个工程打两次包：
      # ① iPhone 包走默认的 aggressive 画像（压 dpr、关 GPU 背景、狠压封面）；
      # ② iPad 包用 PROFILE_IPAD 编译条件切到 light 画像（只压封面 / 懒加载 / 回收 GL，
      #    保留站点默认背景与全部动效 —— 用户要求「不用做太多优化，不然会很丑」）。
      - name: Build iPhone (unsigned)
        run: |
          set -o pipefail
          xcodebuild \
            -project "Folia.xcodeproj" \
            -scheme "Folia" \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$GITHUB_WORKSPACE/build-iphone" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_ENTITLEMENTS="" \
            build 2>&1 | tee /tmp/xcodebuild-iphone.log

      - name: Build iPad (unsigned, light profile)
        run: |
          set -o pipefail
          xcodebuild \
            -project "Folia.xcodeproj" \
            -scheme "Folia" \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$GITHUB_WORKSPACE/build-ipad" \
            SWIFT_ACTIVE_COMPILATION_CONDITIONS=PROFILE_IPAD \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_ENTITLEMENTS="" \
            build 2>&1 | tee /tmp/xcodebuild-ipad.log

      - name: Show errors on failure
        if: failure()
        run: |
          for log in /tmp/xcodebuild-iphone.log /tmp/xcodebuild-ipad.log; do
            echo "=== ERROR LINES ($log) ==="
            grep -nE "error:" "$log" | head -n 80 || true
          done

      - name: Upload compiler logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-logs
          path: |
            /tmp/xcodebuild-iphone.log
            /tmp/xcodebuild-ipad.log
          if-no-files-found: warn

      - name: Store compiler logs on branch
        if: always()
        continue-on-error: true
        run: |
          mkdir -p ci-logs
          {
            echo "sha: ${GITHUB_SHA}"
            echo "run: ${GITHUB_RUN_ID}"
            echo "=== IPHONE ERROR LINES ==="
            grep -nE "error:" /tmp/xcodebuild-iphone.log | head -n 80 || true
            echo "=== IPHONE TAIL 300 ==="
            tail -n 300 /tmp/xcodebuild-iphone.log || true
            echo "=== IPAD ERROR LINES ==="
            grep -nE "error:" /tmp/xcodebuild-ipad.log | head -n 80 || true
            echo "=== IPAD TAIL 300 ==="
            tail -n 300 /tmp/xcodebuild-ipad.log || true
          } > ci-logs/last-build.txt
          git checkout --orphan ci-log-tmp
          git rm -rq --cached . || true
          git add -f ci-logs/last-build.txt
          git -c user.name=ci-bot -c user.email=ci-bot@users.noreply.github.com \
            commit -q -m "ci: compiler log ${GITHUB_SHA}"
          git push -q -f origin ci-log-tmp:ci-log

      - name: Wrap into IPAs
        run: |
          set -e
          wrap () {
            local derived="$1"
            local name="$2"
            cd "$GITHUB_WORKSPACE/$derived/Build/Products/Release-iphoneos"
            rm -rf Payload
            mkdir -p Payload
            cp -R Folia.app Payload/
            zip -qry "$name.ipa" Payload
            ls -lh "$name.ipa"
            echo "$name app bundle: $(du -sh Folia.app)"
            test -f Payload/Folia.app/www/index.html
            test -f Payload/Folia.app/Assets.car
            echo "version: $(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' Payload/Folia.app/Info.plist) / $(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' Payload/Folia.app/Info.plist)"
            /usr/libexec/PlistBuddy -c "Print :CFBundleIcons:CFBundlePrimaryIcon:CFBundleIconName" Payload/Folia.app/Info.plist
            /usr/libexec/PlistBuddy -c "Print :CFBundleIcons:CFBundlePrimaryIcon:CFBundleIconFiles" Payload/Folia.app/Info.plist
            /usr/libexec/PlistBuddy -c "Print :CFBundleIcons~ipad:CFBundlePrimaryIcon:CFBundleIconFiles" Payload/Folia.app/Info.plist
            test -n "$(strings Payload/Folia.app/Folia | grep -F 'https://app.folia-api.top/' || true)"
          }
          wrap build-iphone "iPhone-Folia-2.2.0"
          wrap build-ipad "iPad-Folia-2.2.0"

      - name: Upload iPhone IPA
        uses: actions/upload-artifact@v4
        with:
          name: iPhone-Folia-2.2.0-ipa
          path: build-iphone/Build/Products/Release-iphoneos/iPhone-Folia-2.2.0.ipa
          if-no-files-found: error

      - name: Upload iPad IPA
        uses: actions/upload-artifact@v4
        with:
          name: iPad-Folia-2.2.0-ipa
          path: build-ipad/Build/Products/Release-iphoneos/iPad-Folia-2.2.0.ipa
          if-no-files-found: error

      - name: Publish IPAs to branch
        run: |
          cp build-iphone/Build/Products/Release-iphoneos/iPhone-Folia-2.2.0.ipa "$GITHUB_WORKSPACE/iPhone-Folia-2.2.0.ipa"
          cp build-ipad/Build/Products/Release-iphoneos/iPad-Folia-2.2.0.ipa "$GITHUB_WORKSPACE/iPad-Folia-2.2.0.ipa"
          cd "$GITHUB_WORKSPACE"
          git checkout --orphan ipa-tmp
          git rm -rq --cached . || true
          git add -f iPhone-Folia-2.2.0.ipa iPad-Folia-2.2.0.ipa
          git -c user.name=ci-bot -c user.email=ci-bot@users.noreply.github.com \
            commit -q -m "ipa: ${GITHUB_SHA}"
          git push -q -f origin ipa-tmp:ipa

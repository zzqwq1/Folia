name: Build unsigned IPA

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Show toolchain
        run: |
          xcodebuild -version
          xcrun swift --version

      - name: Install xcodegen
        run: |
          if ! command -v xcodegen >/dev/null 2>&1; then
            brew install xcodegen
          fi
          xcodegen --version

      - name: Verify web assets
        run: |
          test -f Folia/www/index.html
          echo "www files: $(find Folia/www -type f | wc -l)"
          du -sh Folia/www
          # 离线副本要能被 file:// 直接打开：任何根绝对路径（="/..." / "/assets/..."）
          # 在 file:// 下都会解析到磁盘根，主 bundle 直接 404，回退出来就是一片白。
          bad_html=$(grep -cE '(href|src)="/' Folia/www/index.html || true)
          echo "index.html root-absolute refs: $bad_html"
          test "$bad_html" -eq 0
          bad_js=$(grep -rlE '"/assets/' Folia/www/assets --include='*.js' --include='*.css' | wc -l)
          echo "assets files with root-absolute refs: $bad_js"
          test "$bad_js" -eq 0

      - name: Generate Xcode project
        run: |
          xcodegen generate
          ls -d Folia.xcodeproj

      - name: Build (unsigned)
        run: |
          set -o pipefail
          xcodebuild \
            -project "Folia.xcodeproj" \
            -scheme "Folia" \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$GITHUB_WORKSPACE/build" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_ENTITLEMENTS="" \
            build 2>&1 | tee /tmp/xcodebuild.log

      - name: Show errors on failure
        if: failure()
        run: |
          echo "=== ERROR LINES ==="
          grep -nE "error:|error " /tmp/xcodebuild.log | head -n 80 || true
          echo "=== END ==="
          # 日志推到固定分支，便于不进 GitHub 界面也能取到
          {
            echo "=== ERROR LINES ==="
            grep -nE "error:" /tmp/xcodebuild.log | head -n 60 || true
            echo "=== TAIL ==="
            tail -n 200 /tmp/xcodebuild.log || true
          } > "$GITHUB_WORKSPACE/.build-error.txt"
          cd "$GITHUB_WORKSPACE"
          git config user.name "ci-bot"
          git config user.email "ci-bot@users.noreply.github.com"
          git checkout -q -B ci-log
          git add -f .build-error.txt
          git commit -q -m "ci: build error log for ${GITHUB_SHA}" || true
          git push -q -f origin ci-log || true

      - name: Upload compiler log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-log
          path: /tmp/xcodebuild.log
          if-no-files-found: warn

      - name: Wrap into IPA
        run: |
          set -e
          cd "$GITHUB_WORKSPACE/build/Build/Products/Release-iphoneos"
          rm -rf Payload
          mkdir -p Payload
          cp -R Folia.app Payload/
          zip -qry Folia-Web-unsigned.ipa Payload
          ls -lh Folia-Web-unsigned.ipa
          echo "app bundle: $(du -sh Folia.app)"
          test -f Payload/Folia.app/www/index.html
          test -f Payload/Folia.app/Assets.car
          /usr/libexec/PlistBuddy -c "Print :CFBundleIcons:CFBundlePrimaryIcon:CFBundleIconName" Payload/Folia.app/Info.plist
          /usr/libexec/PlistBuddy -c "Print :CFBundleIcons:CFBundlePrimaryIcon:CFBundleIconFiles" Payload/Folia.app/Info.plist
          /usr/libexec/PlistBuddy -c "Print :CFBundleIcons~ipad:CFBundlePrimaryIcon:CFBundleIconFiles" Payload/Folia.app/Info.plist
          ls -lh Payload/Folia.app/Assets.car
          echo "start url:"
          strings Payload/Folia.app/Folia | grep -F "https://app.folia-api.top/" | head -n 3
          test -n "$(strings Payload/Folia.app/Folia | grep -F 'https://app.folia-api.top/' || true)"

      - name: Dump compiled icon
        run: |
          xcrun assetutil --info "$GITHUB_WORKSPACE/build/Build/Products/Release-iphoneos/Folia.app/Assets.car" | grep -nE '"Name"|"Scale"|"PixelWidth"|"PixelHeight"|"Idiom"' | head -n 60 || true

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: Folia-Web-unsigned-ipa
          path: build/Build/Products/Release-iphoneos/Folia-Web-unsigned.ipa
          if-no-files-found: error

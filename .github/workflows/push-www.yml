# 前端构建（约 1900 个小文件）没法经 GitHub MCP 的文本接口原样写入二进制，
# 所以按目录分批上传成 `www-chunks/<目录名>.json`（每项 { path, content(base64) }），
# 由这里展开到 Folia/www，然后触发一次打包。
#
# 分批数据只用于这次同步；跑完后删掉 `.github/workflows/push-www.yml` 即可停用。
name: Sync www chunks

on:
  push:
    branches: [main]
    paths:
      - 'www-chunks/**'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Expand chunks into Folia/www
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const path = require('path');
          const dir = 'www-chunks';
          let n = 0;
          for (const name of fs.readdirSync(dir).filter((f) => f.endsWith('.json'))) {
            const items = JSON.parse(fs.readFileSync(path.join(dir, name), 'utf8'));
            for (const it of items) {
              if (!it.path.startsWith('Folia/www/')) throw new Error('unexpected path: ' + it.path);
              fs.mkdirSync(path.dirname(it.path), { recursive: true });
              fs.writeFileSync(it.path, Buffer.from(it.content, 'base64'));
              n += 1;
            }
            console.log(name, items.length);
          }
          console.log('total written:', n);
          NODE

      - name: Verify web assets
        run: |
          test -f Folia/www/index.html
          grep -qF 'main-IaIRsYLo.js' Folia/www/index.html
          bad_html=$(grep -cE '(href|src)="/' Folia/www/index.html || true)
          echo "index.html root-absolute refs: $bad_html"
          test "$bad_html" -eq 0
          bad_js=$(grep -rlE '"/assets/' Folia/www/assets --include='*.js' --include='*.css' | wc -l)
          echo "assets files with root-absolute refs: $bad_js"
          test "$bad_js" -eq 0
          find www-chunks -type f -delete

      - name: Commit and push
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A Folia/www www-chunks
          git commit -m 'chore(ios): 同步 2.1 前端构建到壳内离线副本' || echo 'nothing to commit'
          git push

      - name: Trigger IPA build
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run ios-build.yml --ref main -f word=www-sync || true

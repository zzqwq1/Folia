    <!-- 首屏加载遮罩：内联样式，随 HTML 首帧一起绘制，不等 index.css 与 JS bundle。
         由 src/utils/appSplash.ts 在 React 挂载后淡出并移除。 -->
    <style>
      html,
      body {
        background-color: #09090b;
      }

      /* iOS 全面屏安全区适配：配合 viewport-fit=cover 使用。
         桌面/非 iOS 环境 env(safe-area-inset-*) 恒为 0，不影响桌面版布局。
         根容器 #root > div 是 fixed inset-0 的全屏布局节点，给它加 padding，
         让内容避让状态栏与底部 Home 指示条，同时背景仍铺满全屏（无黑边）。 */
      @supports (padding-top: env(safe-area-inset-top)) {
        #root > div {
          padding-top: env(safe-area-inset-top);
          padding-right: env(safe-area-inset-right);
          padding-bottom: env(safe-area-inset-bottom);
          padding-left: env(safe-area-inset-left);
        }
      }

      #app-splash {
        position: fixed;
        inset: 0;
        z-index: 2147483000;
        display: flex;
        align-items: center;
        justify-content: center;
        background-color: #09090b;
        font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif;
        transition: opacity 320ms ease;
      }

      #app-splash.is-hiding {
        opacity: 0;
        pointer-events: none;
      }

      #app-splash .app-splash-inner {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 28px;
        opacity: 0;
        /* 延迟淡入：命中缓存的秒开不会闪一下遮罩内容。 */
        animation: app-splash-in 420ms ease 180ms forwards;
      }

      #app-splash .app-splash-title {
        /* 巨大字号，随视口收缩，窄屏也不会溢出。 */
        font-size: clamp(64px, 17vw, 200px);
        font-weight: 600;
        line-height: 1;
        letter-spacing: 0.06em;
        text-indent: 0.06em;
      }

      /* 每个字母占一个固定宽度的盒子（宽度由脚本按各字体的最大字宽测出来，单位 em，
         跟着 font-size 缩放），字体来回切换时字形变但排版不抖。
         纯白 + text-shadow 辉光，辉光强度由脚本逐字母随机，这里的值是脚本失败时的兜底。 */
      #app-splash .app-splash-title span {
        display: inline-block;
        text-align: center;
        font-family: inherit;
        color: #ffffff;
        text-shadow: 0 0 8px rgba(255, 255, 255, 0.55), 0 0 28px rgba(255, 255, 255, 0.3);
        /* 缩放原点压到基线附近，字母大小浮动时底边大致对齐。 */
        transform-origin: center 78%;
      }

      /* 循环波形：每根竖条只做 transform 动画，合成器线程执行，不占主线程。 */
      #app-splash .app-splash-wave {
        display: flex;
        align-items: center;
        gap: clamp(6px, 1.1vw, 11px);
        height: clamp(42px, 7.5vw, 92px);
      }

      /* --floor / --peak / --alpha / --glow / --w 由下面的内联脚本逐条随机化；
         这里的默认值是脚本失败时的静态兜底。纯白平涂 + 外发光，不做渐变。 */
      #app-splash .app-splash-wave span {
        width: var(--w, 5px);
        height: 100%;
        transform: scaleY(var(--floor, 0.18));
        background-color: rgba(255, 255, 255, var(--alpha, 0.85));
        box-shadow: 0 0 var(--glow, 14px) rgba(255, 255, 255, 0.35);
        animation: app-splash-wave 1100ms ease-in-out infinite;
      }

      #app-splash .app-splash-wave span:nth-child(even) {
        animation-delay: -550ms;
      }

      @keyframes app-splash-in {
        to {
          opacity: 1;
        }
      }

      @keyframes app-splash-wave {
        0%,
        100% {
          transform: scaleY(var(--floor, 0.18));
        }
        50% {
          transform: scaleY(var(--peak, 1));
        }
      }

      @media (prefers-reduced-motion: reduce) {
        #app-splash .app-splash-inner {
          opacity: 1;
          animation: none;
        }

        #app-splash .app-splash-wave span {
          /* 不动，但保留随机高度，静态波形仍然有形状。 */
          transform: scaleY(calc(var(--peak, 0.5) * 0.7));
          animation: none;
          opacity: 0.5;
        }
      }
    </style>
</head>
  <body>
    <div id="app-splash" role="status" aria-live="polite" aria-label="Loading Folia">
      <div class="app-splash-inner">
        <div class="app-splash-title" aria-label="Folia"><span>F</span><span>o</span><span>l</span><span>i</span><span>a</span></div>
        <div class="app-splash-wave" aria-hidden="true">
          <span></span>
          <span></span>
          <span></span>
          <span></span>
          <span></span>
          <span></span>
          <span></span>
          <span></span>
          <span></span>
          <span></span>
          <span></span>
          <span></span>
          <span></span>
        </div>
      </div>
    </div>
    <script>
      (function () {
        try {
          // 需要透明背景的入口不能盖遮罩：OBS 浏览器源会被直接推流捕获，
          // Electron 的透明播放背景 / 壁纸窗口（main.cjs 传 splash=0）会在桌面上闪一个黑块。
          var params = new URLSearchParams(window.location.search);
          if (params.get('obs') === '1' || window.location.pathname === '/obs' || params.get('splash') === '0') {
            var splash = document.getElementById('app-splash');
            if (splash) {
              splash.remove();
            }
            return;
          }
        } catch (error) {
          // 探测失败时保留遮罩，React 挂载后仍会移除它。
        }

        // 波形逐条随机化：高度、宽度、节奏、相位和颜色都带抖动，每次加载的形状都不一样。
        // 同步执行，在首帧绘制前完成；失败时 CSS 里的默认值会兜底成一条静态波形。
        try {
          var rand = function (min, max) {
            return min + Math.random() * (max - min);
          };

          var bars = document.querySelectorAll('#app-splash .app-splash-wave span');
          for (var i = 0; i < bars.length; i += 1) {
            var bar = bars[i];
            // 中间高、两端低的整体包络，再叠加随机量，形状既像波形又不规整。
            var envelope = Math.sin(((i + 0.5) / bars.length) * Math.PI);
            var peak = Math.min(1, 0.32 + envelope * rand(0.38, 0.72));
            bar.style.setProperty('--peak', peak.toFixed(3));
            bar.style.setProperty('--floor', rand(0.08, 0.24).toFixed(3));
            bar.style.setProperty('--w', rand(3.5, 6.5).toFixed(2) + 'px');
            // 白色平涂，只在亮度和辉光半径上留随机：高的条更亮、光晕更散。
            bar.style.setProperty('--alpha', rand(0.55, 1).toFixed(2));
            bar.style.setProperty('--glow', Math.round(rand(6, 26)) + 'px');
            bar.style.animationDuration = Math.round(rand(820, 1500)) + 'ms';
            bar.style.animationDelay = '-' + Math.round(rand(0, 1500)) + 'ms';
          }
        } catch (error) {
          // 随机化失败无所谓，CSS 默认值已经能跑一条波形。
        }

        // Folia 五个字母不断跳到不同字形（Loki 片头那种字体轮盘），偶尔整体落回基准样式。
        // 只用通用字族，再叠加字重、斜体和横向拉伸——不同机器上装的字体不一样，
        // 单靠字体名会退化成同一张脸，加上这几个轴才保证每次跳变都看得出来。
        try {
          if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
            return;
          }
          var BASE_FONT = "'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif";
          var FAMILIES = [BASE_FONT, 'serif', 'monospace', 'cursive', 'fantasy', 'system-ui'];
          var WEIGHTS = ['400', '600', '800'];
          var SCALES = [0.86, 0.94, 1, 1.06, 1.12];
          var letters = document.querySelectorAll('#app-splash .app-splash-title span');
          if (!letters.length) {
            return;
          }

          // 用 canvas 在 100px 基准下量出每个字母在所有候选字形里的最大宽度，换算成 em 写死盒子宽度，
          // 这样字形来回换、词标整体不会左右乱跳。
          var measure = document.createElement('canvas').getContext('2d');
          for (var m = 0; m < letters.length; m += 1) {
            var glyph = letters[m].textContent;
            var widest = 0;
            for (var f = 0; f < FAMILIES.length; f += 1) {
              measure.font = 'italic 800 100px ' + FAMILIES[f];
              widest = Math.max(widest, measure.measureText(glyph).width);
              measure.font = '800 100px ' + FAMILIES[f];
              widest = Math.max(widest, measure.measureText(glyph).width);
            }
            if (widest > 0) {
              // 余量留给最大的缩放组合（1.12 × 1.12），字形放大时不会压到相邻字母。
              letters[m].style.width = ((widest / 100) * 1.26 + 0.04).toFixed(3) + 'em';
            }
          }

          var pick = function (list) {
            return list[Math.floor(Math.random() * list.length)];
          };
          var jitter = function (min, max) {
            return min + Math.random() * (max - min);
          };
          // 辉光分三档：干净、微光、过曝。片头里字母亮度参差不齐，靠这个模拟。
          var randomGlow = function () {
            var roll = Math.random();
            if (roll < 0.3) {
              return '0 0 ' + (2 + Math.random() * 4).toFixed(1) + 'px rgba(255,255,255,0.35)';
            }
            if (roll < 0.75) {
              return '0 0 ' + (6 + Math.random() * 8).toFixed(1) + 'px rgba(255,255,255,0.7), 0 0 ' +
                (20 + Math.random() * 16).toFixed(1) + 'px rgba(255,255,255,0.35)';
            }
            return '0 0 ' + (10 + Math.random() * 8).toFixed(1) + 'px rgba(255,255,255,0.95), 0 0 ' +
              (34 + Math.random() * 20).toFixed(1) + 'px rgba(255,255,255,0.7), 0 0 ' +
              (70 + Math.random() * 40).toFixed(1) + 'px rgba(255,255,255,0.45)';
          };
          var timer = window.setInterval(function () {
            // 遮罩被移除后自己停掉，不留空转的定时器。
            if (!document.getElementById('app-splash')) {
              window.clearInterval(timer);
              return;
            }
            // 一拍只换一个字母，偶尔两个，节奏克制。
            var swaps = Math.random() < 0.25 ? 2 : 1;
            for (var i = 0; i < swaps; i += 1) {
              var letter = pick(letters);
              letter.style.fontFamily = pick(FAMILIES);
              letter.style.fontWeight = pick(WEIGHTS);
              letter.style.fontStyle = Math.random() < 0.25 ? 'italic' : 'normal';
              // 大小和宽窄都用 transform 做：不进入布局，盒子宽度不受影响，排版才不会抖。
              var sizeScale = jitter(0.86, 1.12);
              letter.style.transform =
                'scale(' + (sizeScale * pick(SCALES)).toFixed(3) + ',' + sizeScale.toFixed(3) + ')';
              letter.style.textShadow = randomGlow();
            }
          }, 380);
        } catch (error) {
          // 字体轮盘失败就保持静态词标。
        }
      })();
    </script>
    <!-- ========== iOS 原生壳适配 开始 ==========
         WKWebView 铺满全屏、状态栏浮在内容上，env(safe-area-inset-*) 在首次绘制时可能还是 0，
         按下述顺序用实测的屏幕尺寸兜住：先试 env()，再试 visualViewport，最后按 UA 型号表。
         只按 iPhone/iPad 的 UA 生效，桌面版与安卓不受影响。 -->
    <style>
      html[data-folia-ios='1'],
      html[data-folia-ios='1'] body {
        /* 关掉双击缩放与长按选中，行为贴近原生 */
        -webkit-text-size-adjust: 100%;
        -webkit-tap-highlight-color: transparent;
        overscroll-behavior: none;
      }
      html[data-folia-ios='1'] #root > div {
        padding-top: var(--folia-safe-top, env(safe-area-inset-top, 0px));
        padding-right: var(--folia-safe-right, env(safe-area-inset-right, 0px));
        padding-bottom: var(--folia-safe-bottom, env(safe-area-inset-bottom, 0px));
        padding-left: var(--folia-safe-left, env(safe-area-inset-left, 0px));
      }
      /* 诊断条（仅壳内）：避免盖住底部播放条 */
      html[data-folia-ios='1'] [data-folia-diag='1'] {
        padding-bottom: calc(8px + env(safe-area-inset-bottom, 0px)) !important;
      }
      /* 扫码登录的二维码：接口没给 data: 前缀时只有裸 base64，补上前缀，否则是一片空白 */
      html[data-folia-ios='1'] img[data-folia-b64='1'] {
        background: #fff;
      }
    </style>
    <script>
      (function () {
        var ua = navigator.userAgent || '';
        if (!/iPhone|iPad|iPod/i.test(ua)) return;
        var root = document.documentElement;
        root.setAttribute('data-folia-ios', '1');

        // 屏高 → 上下安全区（逻辑像素）。UA 与 CSS 尺寸一致时这两张表与真机 env() 值相等，
        // 用来在 env() 还没就绪时给一个正确值，避免内容被状态栏盖住或底部多出一截黑边。
        function insetsFor(width, height, dpr) {
          var short = Math.min(width, height);
          // iPad：上下各 24pt
          if (/iPad/i.test(ua) || short >= 744) return { top: 24, bottom: 20 };
          // 带灵动岛 / 刘海的机型
          if (short >= 440) return { top: 62, bottom: 34 }; // 17 Pro Max 等 6.9"
          if (short >= 402) return { top: 62, bottom: 34 }; // 16 Pro / 17 Pro
          if (short >= 393) return { top: 59, bottom: 34 }; // 15 / 16 / 14 Pro
          if (short >= 390) return { top: 47, bottom: 34 }; // 12 / 13 / 14 非 Pro
          if (short >= 375) return { top: 47, bottom: 34 }; // X / XS / 11 Pro / mini 系列
          if (short >= 360 && dpr >= 3) return { top: 44, bottom: 34 }; // 8 Plus 等
          return { top: 20, bottom: 0 }; // SE / 8 及更早：有状态栏、无 Home 条
        }

        function measured() {
          var w = window.innerWidth || root.clientWidth;
          var h = window.innerHeight || root.clientHeight;
          var dpr = window.devicePixelRatio || 1;
          // visualViewport 高度会扣掉浏览器栏；壳内是全屏，取较大者更接近屏幕尺寸
          var vv = window.visualViewport;
          if (vv && vv.height > h) h = vv.height;
          return insetsFor(w, h, dpr);
        }

        function probeEnv() {
          var probe = document.getElementById('folia-safe-probe');
          if (!probe) {
            probe = document.createElement('div');
            probe.id = 'folia-safe-probe';
            probe.style.cssText = 'position:fixed;left:0;top:0;width:0;height:0;visibility:hidden;pointer-events:none;'
              + 'padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);'
              + 'padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px);';
            document.body.appendChild(probe);
          }
          var s = window.getComputedStyle(probe);
          return {
            top: parseFloat(s.paddingTop) || 0,
            bottom: parseFloat(s.paddingBottom) || 0,
            left: parseFloat(s.paddingLeft) || 0,
            right: parseFloat(s.paddingRight) || 0
          };
        }

        function apply() {
          var envValue = probeEnv();
          var guess = measured();
          var top = envValue.top || guess.top;
          var bottom = envValue.bottom || guess.bottom;
          root.style.setProperty('--folia-safe-top', top + 'px');
          root.style.setProperty('--folia-safe-bottom', bottom + 'px');
          root.style.setProperty('--folia-safe-left', (envValue.left || 0) + 'px');
          root.style.setProperty('--folia-safe-right', (envValue.right || 0) + 'px');
        }

        apply();
        window.addEventListener('resize', apply);
        window.addEventListener('orientationchange', apply);
        if (window.visualViewport) window.visualViewport.addEventListener('resize', apply);
        document.addEventListener('DOMContentLoaded', apply);

        // 扫码登录的图片：npm 版接口回的是完整 dataURL，某些代理/自建服务只回裸 base64，
        // <img> 拿到裸 base64 会显示空白。这里补上 data: 前缀，PNG/JPEG 按魔数判断。
        var BASE64_ONLY = /^[A-Za-z0-9+/=\r\n]+$/;
        function fixImage(img) {
          if (!img || img.getAttribute('data-folia-b64') === '1') return;
          var src = (img.getAttribute('src') || '').trim();
          if (!src || src.indexOf('data:') === 0 || src.length < 512 || !BASE64_ONLY.test(src)) return;
          var mime = src.slice(0, 4).indexOf('/9j/') === 0 ? 'image/jpeg' : 'image/png';
          img.setAttribute('src', 'data:' + mime + ';base64,' + src.replace(/[\r\n]/g, ''));
          img.setAttribute('data-folia-b64', '1');
        }
        function sweep() {
          var imgs = document.querySelectorAll('img');
          for (var i = 0; i < imgs.length; i += 1) fixImage(imgs[i]);
        }
        new MutationObserver(sweep).observe(root, { subtree: true, childList: true, attributes: true, attributeFilter: ['src'] });
      })();
    </script>

      </div>
      <div class="donate-col">
        <img src="/qq-group-qr.png" alt="QQ 群二维码">

</div>

<script>
// 版本号唯一来源：下面的赞赏弹窗和更新公告脚本都读这两个值，避免多处版本号不一致。
// FOLIA_VERSION = 本 App 当前版本；FOLIA_LATEST_VERSION = 最新可下载版本。
var FOLIA_VERSION = '1.8.5';
var FOLIA_LATEST_VERSION = '1.8.5';
(function(){
  try {
    var p = new URLSearchParams(window.location.search);
    if (p.get('obs') === '1' || window.location.pathname === '/obs' || p.get('splash') === '0') return;
  } catch (e) {}
  // iOS 原生壳（WKWebView）里不弹：这个弹窗是网页版的赞赏入口，装在 App 里只是开机挡一层。
  if (/iPhone|iPad|iPod/i.test(navigator.userAgent || '')) return;

  var mask = document.getElementById('donate-mask');
  if (!mask) return;

  // 用全局版本号回填，保证「当前版本」和「最新版本」显示的是同一处来源。
  var verNum = document.getElementById('donate-version-num');
  if (verNum && typeof FOLIA_VERSION === 'string' && FOLIA_VERSION) { verNum.textContent = FOLIA_VERSION; }
  var latestNum = document.getElementById('donate-latest-num');
  if (latestNum && typeof FOLIA_LATEST_VERSION === 'string' && FOLIA_LATEST_VERSION) { latestNum.textContent = FOLIA_LATEST_VERSION; }

  var KEY = 'folia.donate.shown';
  var shown = false;
  try { shown = sessionStorage.getItem(KEY) === '1'; } catch (e) {}
  if (!shown) {
    setTimeout(function(){ mask.classList.add('show'); }, 1600);
    try { sessionStorage.setItem(KEY, '1'); } catch (e) {}
  }

  var QUARK_URL = 'https://pan.quark.cn/s/934c480d5b9c';
  var getLatestBtn = document.getElementById('donate-get-latest');
  if (getLatestBtn) {
    getLatestBtn.addEventListener('click', function(e){
      e.preventDefault();
      try { window.open(QUARK_URL, '_blank'); } catch(err) { location.href = QUARK_URL; }
    });
  }

  document.getElementById('donate-close').addEventListener('click', function(){ mask.classList.remove('show'); });
  mask.addEventListener('click', function(e){ if (e.target === mask) mask.classList.remove('show'); });
})();
</script>
<!-- ========== 赞赏弹窗 结束 ========== -->

<div id="update-mask" style="display:none;position:fixed;inset:0;z-index:2147483500;background:rgba(0,0,0,.62);backdrop-filter:blur(14px);align-items:center;justify-content:center;padding:20px">
  <div style="width:100%;max-width:340px;background:#fff;border-radius:22px;padding:24px 22px 18px;box-shadow:0 24px 60px rgba(0,0,0,.35);text-align:center;color:#111">

    <p style="margin:14px 0 0;font-size:14px;line-height:1.7;color:#333">最新 <b style="color:#ff4d6d">1.8</b> 版本已发布，请及时下载！</p>
    <p style="margin:10px 0 0;font-size:12px;color:#999">点击下方按钮前往夸克网盘下载</p>
    <div style="margin-top:18px;display:flex;gap:10px">
      <button id="update-open-quark" style="flex:1;border:0;border-radius:999px;padding:11px 0;font-size:14px;font-weight:600;color:#fff;background:linear-gradient(135deg,#ff7e9d,#ff4d6d);cursor:pointer">立即更新</button>
      <button id="update-close" style="flex:1;border:0;border-radius:999px;padding:11px 0;font-size:14px;font-weight:600;color:#444;background:#f2f3f5;cursor:pointer">我知道了</button>
    </div>
  </div>
</div>
<script>
(function () {
  var LATEST = (typeof FOLIA_LATEST_VERSION === 'string' && FOLIA_LATEST_VERSION) || '1.8.5';
  var CUR = (typeof FOLIA_VERSION === 'string' && FOLIA_VERSION) || '1.8.5';
  if (CUR === LATEST) return;

  var KEY = 'folia.update.seen.' + LATEST;
  try { if (localStorage.getItem(KEY)) return; } catch (e) {}

  var mask = document.getElementById('update-mask');
  if (!mask) return;

  function show() { mask.style.display = 'flex'; }
  function close() {
    mask.style.display = 'none';
    try { localStorage.setItem(KEY, '1'); } catch (e) {}
  }

  document.getElementById('update-close').addEventListener('click', close);
  document.getElementById('update-open-quark')?.addEventListener('click', function(){
    try { window.open('https://pan.quark.cn/s/934c480d5b9c', '_blank'); }
    catch(err) { location.href = 'https://pan.quark.cn/s/934c480d5b9c'; }
    close();
  });
  mask.addEventListener('click', function (e) { if (e.target === mask) close(); });

  var waited = 0;
  var timer = setInterval(function () {
    waited += 400;
    var donate = document.getElementById('donate-mask');
    var donateOpen = donate && donate.classList.contains('show');
    if (!donateOpen) {
      clearInterval(timer);
      setTimeout(show, 400);
    } else if (waited > 30000) {
      clearInterval(timer);
    }
  }, 400);
})();
</script>
<!-- ========== 版本更新公告 结束 ========== -->

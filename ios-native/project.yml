name: FoliaNative
options:
  bundleIdPrefix: app.folia
  deploymentTarget:
    iOS: "16.0"
targets:
  FoliaNative:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: Sources/FoliaNativeApp.swift
      - path: Sources/Audio
      - path: Sources/Models
      - path: Sources/Player
      - path: Sources/Services
      - path: Sources/Views
      - path: Sources/Wall
    info:
      path: Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.folia.major.native
        SWIFT_VERSION: "5.9"
        TARGETED_DEVICE_FAMILY: "1,2"
        IPHONEOS_DEPLOYMENT_TARGET: "16.0"
        ENABLE_USER_SCRIPT_SANDBOXING: NO

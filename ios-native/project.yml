name: FoliaNative
options:
  bundleIdPrefix: app.folia
  deploymentTarget:
    iOS: "16.0"
targets:
  FoliaNative:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: Sources/FoliaNativeApp.swift
      - path: Sources/Audio
      - path: Sources/Web
    resources:
      - path: Assets.xcassets
        buildPhase: resources
    postBuildScripts:
      # 前端 dist 体积大且内容多变，用 folder reference 依赖 Xcode 的复制行为不够可控；
      # 改在构建最后阶段直接把 dist 复制进 app bundle，FoliaLocalServer 从 bundle 的 dist 目录读取。
      - name: Embed web dist
        script: |
          mkdir -p "$TARGET_BUILD_DIR/$FULL_PRODUCT_NAME/dist"
          cp -R "$SRCROOT/dist/." "$TARGET_BUILD_DIR/$FULL_PRODUCT_NAME/dist/"
    info:
      path: Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.folia.major.native
        SWIFT_VERSION: "5.9"
        TARGETED_DEVICE_FAMILY: "1,2"
        IPHONEOS_DEPLOYMENT_TARGET: "16.0"
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor

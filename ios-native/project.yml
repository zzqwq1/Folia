name: FoliaNative
options:
  bundleIdPrefix: app.folia
  deploymentTarget:
    iOS: "16.0"
targets:
  FoliaNative:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: Sources
      - path: Assets.xcassets
    dependencies:
      - sdk: AVFoundation.framework
      - sdk: MediaPlayer.framework
      - sdk: Security.framework
    postBuildScripts:
      # AppIcon：优先让 Xcode 原生编译 Assets.xcassets（sources 已显式引用）。
      # 若 xcodegen 生成的 resources phase 仍不可靠（历史问题），postBuildScript 兜底手动 actool。
      # 源 AppIcon.png 已去除 alpha（24bpp RGB）。手动 actool 必须传 --output-partial-info-plist，
      # 否则 actool 只告警不产出 Assets.car。所有诊断走 ::notice:: 注解（公开可读）。
      - name: Compile app icon asset catalog
        script: |
          set -e
          APP_DIR="$TARGET_BUILD_DIR/$FULL_PRODUCT_NAME"
          ICON_SRC="$SRCROOT/Assets.xcassets/AppIcon.appiconset/AppIcon.png"
          echo "::notice title=icon::script-ran app-dir=$APP_DIR"
          echo "::notice title=icon::src-exists=$(test -f "$ICON_SRC" && echo yes || echo no)"
          if [ -f "$ICON_SRC" ]; then
            echo "::notice title=icon::src-ls=$(ls -la "$SRCROOT/Assets.xcassets/AppIcon.appiconset" | tr '\n' ';')"
            echo "::notice title=icon::src-sips=$(sips -g pixelWidth -g pixelHeight -g format -g hasAlpha "$ICON_SRC" 2>&1 | tr '\n' ';')"
          fi
          # 1) Xcode 原生编译阶段已产出 car -> 只需补 CFBundleIconName
          if [ -f "$APP_DIR/Assets.car" ]; then
            echo "::notice title=icon::native-car-present size=$(stat -f %z "$APP_DIR/Assets.car")"
            /usr/libexec/PlistBuddy -c "Delete :CFBundleIcons" "$APP_DIR/Info.plist" 2>/dev/null || true
            /usr/libexec/PlistBuddy -c "Add :CFBundleIcons dict" "$APP_DIR/Info.plist"
            /usr/libexec/PlistBuddy -c "Add :CFBundleIcons:CFBundlePrimaryIcon dict" "$APP_DIR/Info.plist"
            /usr/libexec/PlistBuddy -c "Add :CFBundleIcons:CFBundlePrimaryIcon:CFBundleIconName string AppIcon" "$APP_DIR/Info.plist"
            exit 0
          fi
          echo "::notice title=icon::native-car-missing -> manual actool"
          # 2) 手动 actool（带 --app-icon + --output-partial-info-plist）。诊断信息全量走 ::notice::
          TMPDIR_BUILD=$(mktemp -d "${TMPDIR:-/tmp}/folia-icon.XXXXXX")
          set +e
          ACTOOL_LOG=$(xcrun actool "$SRCROOT/Assets.xcassets" \
            --compile "$APP_DIR" \
            --platform iphoneos \
            --minimum-deployment-target 16.0 \
            --target-device iphone \
            --target-device ipad \
            --app-icon AppIcon \
            --compress-pngs \
            --output-partial-info-plist "$TMPDIR_BUILD/partial-info.plist" \
            --output-format human-readable-text 2>&1)
          ACTOOL_RC=$?
          set -e
          echo "::notice title=icon::actool-rc=$ACTOOL_RC"
          echo "$ACTOOL_LOG" | sed 's/^/::notice title=icon-actool::/'
          if [ -f "$TMPDIR_BUILD/partial-info.plist" ]; then
            echo "::notice title=icon::partial-size=$(stat -f %z "$TMPDIR_BUILD/partial-info.plist")"
            /usr/libexec/PlistBuddy -c "Print" "$TMPDIR_BUILD/partial-info.plist" 2>/dev/null | sed 's/^/::notice title=icon-partial::/' || true
          fi
          CAR=$(find "$APP_DIR" "$TMPDIR_BUILD" -name 'Assets.car' 2>/dev/null | head -n 1)
          echo "::notice title=icon::cars=$(find "$APP_DIR" "$TMPDIR_BUILD" -name '*.car' 2>/dev/null | tr '\n' ' ')"
          if [ -n "$CAR" ]; then
            if [ "$CAR" != "$APP_DIR/Assets.car" ]; then cp "$CAR" "$APP_DIR/Assets.car"; fi
            echo "::notice title=icon::assets-car-ok size=$(stat -f %z "$APP_DIR/Assets.car" 2>/dev/null || echo ?)"
            /usr/libexec/PlistBuddy -c "Delete :CFBundleIcons" "$APP_DIR/Info.plist" 2>/dev/null || true
            /usr/libexec/PlistBuddy -c "Add :CFBundleIcons dict" "$APP_DIR/Info.plist"
            /usr/libexec/PlistBuddy -c "Add :CFBundleIcons:CFBundlePrimaryIcon dict" "$APP_DIR/Info.plist"
            /usr/libexec/PlistBuddy -c "Add :CFBundleIcons:CFBundlePrimaryIcon:CFBundleIconName string AppIcon" "$APP_DIR/Info.plist"
            echo "::notice title=icon::plist-icon-set-car"
            exit 0
          fi
          # 3) 兜底：actool 不可用时用老式 CFBundleIconFiles（sips 生成多尺寸 PNG 直入 bundle 根目录）。
          #    不依赖 actool，保证安装后必有主屏图标。
          echo "::notice title=icon::no-car -> legacy CFBundleIconFiles fallback"
          if [ ! -f "$ICON_SRC" ]; then
            echo "::error::AppIcon.png missing, fallback impossible"
            exit 1
          fi
          gen() { # $1=文件名(含@2x/@3x) $2=像素
            if [ "$2" = "1024" ]; then cp "$ICON_SRC" "$APP_DIR/$1.png";
            else sips -z "$2" "$2" "$ICON_SRC" --out "$APP_DIR/$1.png" >/dev/null 2>&1; fi
          }
          gen AppIcon20x20@2x 40
          gen AppIcon20x20@3x 60
          gen AppIcon29x29@2x 58
          gen AppIcon29x29@3x 87
          gen AppIcon40x40@2x 80
          gen AppIcon40x40@3x 120
          gen AppIcon60x60@2x 120
          gen AppIcon60x60@3x 180
          gen AppIcon76x76@2x 152
          gen AppIcon83.5x83.5@2x 167
          gen AppIcon1024 1024
          echo "::notice title=icon::generated=$(ls "$APP_DIR"/AppIcon*.png | wc -l | tr -d ' ') pngs"
          ICON_PLIST="$APP_DIR/Info.plist"
          /usr/libexec/PlistBuddy -c "Delete :CFBundleIcons" "$ICON_PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :CFBundleIcons dict" "$ICON_PLIST"
          /usr/libexec/PlistBuddy -c "Add :CFBundleIcons:CFBundlePrimaryIcon dict" "$ICON_PLIST"
          /usr/libexec/PlistBuddy -c "Add :CFBundleIcons:CFBundlePrimaryIcon:CFBundleIconFiles array" "$ICON_PLIST"
          for N in AppIcon20x20 AppIcon29x29 AppIcon40x40 AppIcon60x60; do
            /usr/libexec/PlistBuddy -c "Add :CFBundleIcons:CFBundlePrimaryIcon:CFBundleIconFiles: string $N" "$ICON_PLIST"
          done
          /usr/libexec/PlistBuddy -c "Add :CFBundleIcons~ipad dict" "$ICON_PLIST"
          /usr/libexec/PlistBuddy -c "Add :CFBundleIcons~ipad:CFBundlePrimaryIcon dict" "$ICON_PLIST"
          /usr/libexec/PlistBuddy -c "Add :CFBundleIcons~ipad:CFBundlePrimaryIcon:CFBundleIconFiles array" "$ICON_PLIST"
          for N in AppIcon20x20 AppIcon29x29 AppIcon40x40 AppIcon60x60 AppIcon76x76 AppIcon83.5x83.5; do
            /usr/libexec/PlistBuddy -c "Add :CFBundleIcons~ipad:CFBundlePrimaryIcon:CFBundleIconFiles: string $N" "$ICON_PLIST"
          done
          echo "::notice title=icon::legacy-fallback-done"
    info:
      path: Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.folia.major.native
        SWIFT_VERSION: "5.9"
        TARGETED_DEVICE_FAMILY: "1,2"
        IPHONEOS_DEPLOYMENT_TARGET: "16.0"
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor

name: FoliaNative
options:
  bundleIdPrefix: app.folia
  deploymentTarget:
    iOS: "16.0"
targets:
  FoliaNative:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: Sources/FoliaNativeApp.swift
      - path: Sources/Audio
      - path: Sources/Web
      - path: Assets.xcassets
    postBuildScripts:
      # 前端 dist 体积大且内容多变，用 folder reference 依赖 Xcode 的复制行为不够可控；
      # 改在构建最后阶段直接把 dist 复制进 app bundle，FoliaLocalServer 从 bundle 的 dist 目录读取。
      - name: Embed web dist
        script: |
          mkdir -p "$TARGET_BUILD_DIR/$FULL_PRODUCT_NAME/dist"
          cp -R "$SRCROOT/dist/." "$TARGET_BUILD_DIR/$FULL_PRODUCT_NAME/dist/"
      # AppIcon：优先让 Xcode 原生编译 Assets.xcassets（sources 已显式引用）。
      # 若 xcodegen 生成的 resources phase 仍不可靠（历史问题），postBuildScript 兜底手动 actool。
      # 源 AppIcon.png 已去除 alpha（24bpp RGB）。手动 actool 必须传 --output-partial-info-plist，
      # 否则 actool 只告警不产出 Assets.car。所有诊断走 ::notice:: 注解（公开可读）。
      - name: Compile app icon asset catalog
        script: |
          set -e
          APP_DIR="$TARGET_BUILD_DIR/$FULL_PRODUCT_NAME"
          echo "::notice title=icon::script-ran app-dir=$APP_DIR"
          if [ -f "$APP_DIR/Assets.car" ]; then
            echo "::notice title=icon::native-car-present size=$(stat -f %z "$APP_DIR/Assets.car")"
            exit 0
          fi
          echo "::notice title=icon::native-car-missing -> manual actool"
          TMPDIR_BUILD=$(mktemp -d "${TMPDIR:-/tmp}/folia-icon.XXXXXX")
          set +e
          ACTOOL_LOG=$(xcrun actool "$SRCROOT/Assets.xcassets" \
            --compile "$APP_DIR" \
            --platform iphoneos \
            --minimum-deployment-target 16.0 \
            --target-device iphone \
            --target-device ipad \
            --app-icon AppIcon \
            --compress-pngs \
            --output-partial-info-plist "$TMPDIR_BUILD/partial-info.plist" \
            --output-format human-readable-text 2>&1)
          ACTOOL_RC=$?
          set -e
          echo "::notice title=icon::actool-rc=$ACTOOL_RC"
          echo "$ACTOOL_LOG" | sed 's/^/::notice title=icon-actool::/'
          if [ $ACTOOL_RC -ne 0 ]; then
            echo "$ACTOOL_LOG" >&2
            exit $ACTOOL_RC
          fi
          if [ -f "$TMPDIR_BUILD/partial-info.plist" ]; then
            echo "::notice title=icon::partial-plist::$(cat "$TMPDIR_BUILD/partial-info.plist")"
          fi
          echo "::notice title=icon::cars=$(find "$APP_DIR" "$TMPDIR_BUILD" -name '*.car' 2>/dev/null | tr '\n' ' ')"
          CAR=$(find "$APP_DIR" "$TMPDIR_BUILD" -name 'Assets.car' 2>/dev/null | head -n 1)
          if [ -z "$CAR" ]; then
            echo "::error::no Assets.car produced anywhere"
            find /tmp -name '*.car' 2>/dev/null | head -n 10 >&2
            exit 1
          fi
          if [ "$CAR" != "$APP_DIR/Assets.car" ]; then
            cp "$CAR" "$APP_DIR/Assets.car"
          fi
          echo "::notice title=icon::assets-car-ok size=$(stat -f %z "$APP_DIR/Assets.car" 2>/dev/null || echo ?)"
          ICON_PLIST="$APP_DIR/Info.plist"
          /usr/libexec/PlistBuddy -c "Delete :CFBundleIcons" "$ICON_PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :CFBundleIcons dict" "$ICON_PLIST"
          /usr/libexec/PlistBuddy -c "Add :CFBundleIcons:CFBundlePrimaryIcon dict" "$ICON_PLIST"
          /usr/libexec/PlistBuddy -c "Add :CFBundleIcons:CFBundlePrimaryIcon:CFBundleIconName string AppIcon" "$ICON_PLIST"
          echo "::notice title=icon::plist-icon-set"
    info:
      path: Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.folia.major.native
        SWIFT_VERSION: "5.9"
        TARGETED_DEVICE_FAMILY: "1,2"
        IPHONEOS_DEPLOYMENT_TARGET: "16.0"
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor

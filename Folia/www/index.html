    <script>
      (function () {
        try {
          // 需要透明背景的入口不能盖遮罩：OBS 浏览器源会被直接推流捕获，
          // Electron 的透明播放背景 / 壁纸窗口（main.cjs 传 splash=0）会在桌面上闪一个黑块。
          var params = new URLSearchParams(window.location.search);
          if (params.get('obs') === '1' || window.location.pathname === '/obs' || params.get('splash') === '0') {
            var splash = document.getElementById('app-splash');
            if (splash) {
              splash.remove();
            }
            return;
          }
        } catch (error) {
          // 探测失败时保留遮罩，React 挂载后仍会移除它。
        }

        // 波形逐条随机化：高度、宽度、节奏、相位和颜色都带抖动，每次加载的形状都不一样。
        // 同步执行，在首帧绘制前完成；失败时 CSS 里的默认值会兜底成一条静态波形。
        try {
          var rand = function (min, max) {
            return min + Math.random() * (max - min);
          };

          var bars = document.querySelectorAll('#app-splash .app-splash-wave span');
          for (var i = 0; i < bars.length; i += 1) {
            var bar = bars[i];
            // 中间高、两端低的整体包络，再叠加随机量，形状既像波形又不规整。
            var envelope = Math.sin(((i + 0.5) / bars.length) * Math.PI);
            var peak = Math.min(1, 0.32 + envelope * rand(0.38, 0.72));
            bar.style.setProperty('--peak', peak.toFixed(3));
            bar.style.setProperty('--floor', rand(0.08, 0.24).toFixed(3));
            bar.style.setProperty('--w', rand(3.5, 6.5).toFixed(2) + 'px');
            // 白色平涂，只在亮度和辉光半径上留随机：高的条更亮、光晕更散。
            bar.style.setProperty('--alpha', rand(0.55, 1).toFixed(2));
            bar.style.setProperty('--glow', Math.round(rand(6, 26)) + 'px');
            bar.style.animationDuration = Math.round(rand(820, 1500)) + 'ms';
            bar.style.animationDelay = '-' + Math.round(rand(0, 1500)) + 'ms';
          }
        } catch (error) {
          // 随机化失败无所谓，CSS 默认值已经能跑一条波形。
        }

        // Folia 五个字母不断跳到不同字形（Loki 片头那种字体轮盘），偶尔整体落回基准样式。
        // 只用通用字族，再叠加字重、斜体和横向拉伸——不同机器上装的字体不一样，
        // 单靠字体名会退化成同一张脸，加上这几个轴才保证每次跳变都看得出来。

          if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
            return;
          }
          var BASE_FONT = "'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif";
          var FAMILIES = [BASE_FONT, 'serif', 'monospace', 'cursive', 'fantasy', 'system-ui'];
          var WEIGHTS = ['400', '600', '800'];
          var SCALES = [0.86, 0.94, 1, 1.06, 1.12];
          var letters = document.querySelectorAll('#app-splash .app-splash-title span');
          if (!letters.length) {
            return;
          }

          // 用 canvas 在 100px 基准下量出每个字母在所有候选字形里的最大宽度，换算成 em 写死盒子宽度，
          // 这样字形来回换、词标整体不会左右乱跳。

          for (var m = 0; m < letters.length; m += 1) {

            for (var f = 0; f < FAMILIES.length; f += 1) {

              measure.font = '800 100px ' + FAMILIES[f];

          };
          var jitter = function (min, max) {
            return min + Math.random() * (max - min);
          };
          // 辉光分三档：干净、微光、过曝。片头里字母亮度参差不齐，靠这个模拟。
          var randomGlow = function () {
            var roll = Math.random();
            if (roll < 0.3) {
              return '0 0 ' + (2 + Math.random() * 4).toFixed(1) + 'px rgba(255,255,255,0.35)';
            }
            if (roll < 0.75) {
              return '0 0 ' + (6 + Math.random() * 8).toFixed(1) + 'px rgba(255,255,255,0.7), 0 0 ' +
                (20 + Math.random() * 16).toFixed(1) + 'px rgba(255,255,255,0.35)';
            }
            return '0 0 ' + (10 + Math.random() * 8).toFixed(1) + 'px rgba(255,255,255,0.95), 0 0 ' +
              (34 + Math.random() * 20).toFixed(1) + 'px rgba(255,255,255,0.7), 0 0 ' +
              (70 + Math.random() * 40).toFixed(1) + 'px rgba(255,255,255,0.45)';
          };
          var timer = window.setInterval(function () {
            // 遮罩被移除后自己停掉，不留空转的定时器。
            if (!document.getElementById('app-splash')) {
              window.clearInterval(timer);
              return;
            }
            // 一拍只换一个字母，偶尔两个，节奏克制。
            var swaps = Math.random() < 0.25 ? 2 : 1;
            for (var i = 0; i < swaps; i += 1) {
              var letter = pick(letters);
              letter.style.fontFamily = pick(FAMILIES);
              letter.style.fontWeight = pick(WEIGHTS);
              letter.style.fontStyle = Math.random() < 0.25 ? 'italic' : 'normal';

              var sizeScale = jitter(0.86, 1.12);

                'scale(' + (sizeScale * pick(SCALES)).toFixed(3) + ',' + sizeScale.toFixed(3) + ')';
              letter.style.textShadow = randomGlow();
            }
          }, 380);
        } catch (error) {
          // 字体轮盘失败就保持静态词标。
        }
      })();

          if (short >= 402) return { top: 62, bottom: 34 }; // 16 Pro / 17 Pro

          if (short >= 390) return { top: 47, bottom: 34 }; // 12 / 13 / 14 非 Pro
          if (short >= 375) return { top: 47, bottom: 34 }; // X / XS / 11 Pro / mini 系列

            root.style.setProperty('--folia-safe-right', clamped(shell.right || 0) + 'px');

<script>

  } catch (e) {}
  // 装在 App 里同样弹：赞赏入口是功能的一部分，不再是「开机挡一层」。

<!-- ========== 网易 /lyric/new 响应修正 ========== -->
<script>
// NeteaseCloudMusicApi 的 /lyric/new 会把 lrc.lyric 拼成「混合体」：
// 除前几行是 {"t":0,"c":[{"tx":"作词: "},...]} 这样的逐字 JSON 外，
// 后面全是普通 LRC 行。播放器只会按 LRC 解析，遇到 JSON 那几行就直接报错，
// 结果整首歌一句歌词都显示不出来（表现为「网易云没歌词」）。
// 这里在 fetch/XHR 层把响应改写成第二行起那种纯 LRC 文本。
(function () {
  if (window.__foliaLyricFixInstalled) return;
  window.__foliaLyricFixInstalled = true;

  var hasOwn = Object.prototype.hasOwnProperty;

  function parseLine(line) {
    var text = line.trim();
    if (!text || text.charAt(0) !== '{') return null;
    try {
      var obj = JSON.parse(text);
      if (!obj || typeof obj.t !== 'number' || !Array.isArray(obj.c)) return null;
      var content = '';
      for (var i = 0; i < obj.c.length; i++) {
        if (obj.c[i] && typeof obj.c[i].tx === 'string') content += obj.c[i].tx;
      }
      return { t: obj.t, text: content };
    } catch (e) {
      return null;
    }
  }

  function lrcTime(ms) {
    if (ms < 0) ms = 0;
    var centis = Math.floor(ms % 1000 / 10);
    var totalSec = Math.floor(ms / 1000);
    var mm = Math.floor(totalSec / 60);
    var ss = totalSec % 60;
    return '[' + (mm < 10 ? '0' + mm : mm) + ':' + (ss < 10 ? '0' + ss : ss) + '.' +
      (centis < 10 ? '0' + centis : centis) + ']';
  }

  function convert(text) {
    var lines = text.split('\n');
    var touched = false;
    for (var i = 0; i < lines.length; i++) {
      var parsed = parseLine(lines[i]);
      if (!parsed) continue;
      touched = true;
      lines[i] = lrcTime(parsed.t) + parsed.text;
    }
    return touched ? lines.join('\n') : text;
  }

  function fixJson(payload) {
    if (!payload || typeof payload !== 'object') return payload;
    var source = payload;
    if (!payload.lrc && payload.data && payload.data.lrc) source = payload.data;
    var lrc = source.lrc;
    if (!lrc || typeof lrc.lyric !== 'string') return payload;
    var next = convert(lrc.lyric);
    if (next === lrc.lyric) return payload;
    lrc.lyric = next;
    return payload;
  }

  // 只处理网易歌词接口，其它请求一律走原生实现。
  function isTarget(url) {
    return typeof url === 'string' && url.indexOf('/lyric/new') >= 0;
  }

  var nativeFetch = window.fetch;
  if (typeof nativeFetch === 'function') {
    window.fetch = function (input, init) {
      var url = typeof input === 'string' ? input : input && input.url;
      var result = nativeFetch.apply(this, arguments);
      if (!isTarget(url)) return result;
      return result.then(function (response) {
        return response.text().then(function (text) {
          var fixed = text;
          try { fixed = JSON.stringify(fixJson(JSON.parse(text))); } catch (e) {}
          var body = new Response(fixed, {
            status: response.status,
            statusText: response.statusText,
            headers: response.headers
          });
          return body;
        }, function () { return response; });
      });
    };
  }

  var nativeOpen = XMLHttpRequest.prototype.open;
  var nativeSend = XMLHttpRequest.prototype.send;
  XMLHttpRequest.prototype.open = function (method, url) {
    this.__foliaLyricUrl = url;
    return nativeOpen.apply(this, arguments);
  };
  XMLHttpRequest.prototype.send = function () {
    var xhr = this;
    if (isTarget(xhr.__foliaLyricUrl)) {
      xhr.addEventListener('readystatechange', function () {
        if (xhr.readyState !== 4 || xhr.status !== 200) return;
        if (hasOwn.call(xhr, '__foliaFixed')) return;
        xhr.__foliaFixed = true;
        var text = '';
        try { text = xhr.responseText; } catch (e) { return; }
        var fixed = text;
        try { fixed = JSON.stringify(fixJson(JSON.parse(text))); } catch (e) { return; }
        Object.defineProperty(xhr, 'responseText', { value: fixed, configurable: true });
        Object.defineProperty(xhr, 'response', {
          value: xhr.responseType === 'json' ? JSON.parse(fixed) : fixed,
          configurable: true
        });
      }, true);
    }
    return nativeSend.apply(this, arguments);
  };
})();
</script>
<!-- ========== 网易 /lyric/new 响应修正 结束 ========== -->

<!-- ========== QQ / 酷狗 / 波点 隧道登录 开始 ========== -->
<script>
// 这三个平台的登录统一走电脑上跑的网关（cloudflared 隧道）：
//   酷狗 /api/kugou/*、QQ /api/qq/*、波点 /api/bodian?op=*
// 网关把请求转给本机的 kugou / qq / bodian 服务端，返回的是各平台官方二维码，
// 扫码 -> 平台授权 -> qr_check 拿到真实 token。这里只做两件事：
//   1. 把相对路径补成完整隧道地址（原生桥接层只代理 /api/* 前缀）；
//   2. 网关不可达时把错误摊平成前端认识的形状，让界面明确报错、不假装登录成功。
(function () {
  if (window.__foliaProviderProxyInstalled) return;
  window.__foliaProviderProxyInstalled = true;

  // 服务端入口：自己在服务器上部署的固定域名（HTTPS，地址永久不变）。
  // 换服务器/换域名时同步改这里和 Web/LocalApiBridge.swift 的 upstreams。
  var BASES = ['https://api.folia-api.top'];
  var IDS = ['kugou', 'qq', 'bodian'];

  // 命中的基础地址（-1 表示 BASES 里没有一个能连上）。
  // 局域网能连时记住它，后续请求不再白等隧道超时。
  var baseIndex = 0;

  function rewrite(url, index) {
    return BASES[index] + url.slice(url.indexOf('/api/'));
  }

  function target(url) {
    if (typeof url !== 'string') return null;
    for (var i = 0; i < IDS.length; i += 1) {
      var base = '/api/' + IDS[i];
      var at = url.indexOf(base);
      if (at < 0) continue;
      var rest = url.slice(at + base.length);
      if (rest !== '' && rest.charAt(0) !== '/' && rest.charAt(0) !== '?') continue;
      if (baseIndex < 0) return null;
      return rewrite(url, baseIndex);
    }
    return null;
  }

  function unavailable(provider) {
    // 长字段是给界面直接显示的；error/message 是给内部判空用的。
    var text = '服务端未连接：请确认电脑上的 Folia 服务端（gateway / kugou / qq / bodian）正在运行，再重新扫码。';
    return {
      ok: false,
      code: 502,
      status: 'unavailable',
      provider: provider,
      message: text,
      msg: text,
      error: { code: 'unavailable', provider: provider, message: text }
    };
  }

  function providerOf(url) {
    for (var i = 0; i < IDS.length; i += 1) if (url.indexOf('/api/' + IDS[i]) >= 0) return IDS[i];
    return '';
  }

  // 失败时也要给出 200 + 明确错误体：前端的 4xx/5xx 分支会把界面卡在转圈上，
  // 而错误体能让它显示「服务端未连接」。登录因此不会被伪造通过。
  function fail(provider) {
    return new Response(JSON.stringify(unavailable(provider)), {
      status: 200,
      headers: { 'Content-Type': 'application/json; charset=utf-8' }
    });
  }

  // 依次试 BASES：连不上就换下一个。
  // 网络错误和下层的 502 都算「这个入口不行」；只有最后一个入口也失败才放弃。
  function attempt(fn, url, provider) {
    if (baseIndex < 0) return Promise.resolve(fail(provider));
    return new Promise(function (resolve) {
      fn(rewrite(url, baseIndex), function (ok, value) {
        if (ok) { resolve(value); return; }
        if (baseIndex < BASES.length - 1) {
          baseIndex += 1;
          resolve(attempt(fn, url, provider));
          return;
        }
        resolve(fail(provider));
      });
    });
  }

  function fetchOnce(fetchImpl, next, init, done) {
    var rest = typeof init === 'undefined' ? fetchImpl(next) : fetchImpl(next, init);
    rest.then(function (res) {
      if (!res || res.status >= 500) { done(false); return; }
      if (res.status === 404) { done(false); return; }
      // 网关自己判定上游不可用时也会给 502，这里一并算作入口不可用。
      res.clone().text().then(function (text) {
        if (text.indexOf('"status":"unavailable"') >= 0) { done(false); return; }
        done(true, res);
      }, function () { done(true, res); });
    }, function () { done(false); });
  }

  var nativeFetch = window.fetch;
  if (typeof nativeFetch === 'function') {
    window.fetch = function (input, init) {
      var url = typeof input === 'string' ? input : input && input.url;
      if (!target(url)) return nativeFetch.apply(this, arguments);
      var provider = providerOf(url);
      var self = this;
      return attempt(function (next, done) {
        fetchOnce(nativeFetch.bind(self), next, init, done);
      }, url, provider);
    };
  }

  // XHR 改地址：连不上时按同样顺序换下一个入口再重发。
  // 这里只能在 send 阶段重试，因为 open 之后地址就固定了。
  var nativeOpen = XMLHttpRequest.prototype.open;
  var nativeSend = XMLHttpRequest.prototype.send;
  XMLHttpRequest.prototype.open = function (method, url) {
    if (target(url)) {
      this.__foliaProviderUrl = url;
      this.__foliaProviderMethod = method;
    }
    return nativeOpen.apply(this, arguments);
  };
  XMLHttpRequest.prototype.send = function () {
    var xhr = this;
    var url = xhr.__foliaProviderUrl;
    if (!url || baseIndex < 0) return nativeSend.apply(this, arguments);
    var args = Array.prototype.slice.call(arguments);
    var tried = baseIndex;

    function run(index) {
      tried = index;
      nativeOpen.call(xhr, xhr.__foliaProviderMethod || 'GET', rewrite(url, index));
      nativeSend.apply(xhr, args);
    }

    xhr.addEventListener('error', function () {
      if (tried >= BASES.length - 1) return;
      baseIndex = tried + 1;
      run(baseIndex);
    });

    return run(baseIndex);
  };
})();
</script>
<!-- ========== QQ / 酷狗 / 波点 隧道登录 结束 ========== -->

<!-- ========== 播放诊断探针 开始 ========== -->
<script>
// 播放链是 React 状态机，出错时界面上只有「一闪就暂停」，看不到真正原因。
// 这里把 <audio> 的全部事件和失败原因收集到 window.__folioAudio 里，
// 由原生诊断面板（长按左上角）读取显示，不用接电脑也能定位。
(function () {
  if (window.__folioAudioProbe) return;
  var log = [];
  var probe = window.__folioAudioProbe = {
    events: log,
    note: function (tag, detail) {
      log.push(Math.round(performance.now()) + 'ms ' + tag + ' ' + (detail == null ? '' : detail));
      if (log.length > 120) log.shift();
    },
    dump: function () { return log.join('\n'); }
  };

  var ERROR_TEXT = {
    1: 'MEDIA_ERR_ABORTED',
    2: 'MEDIA_ERR_NETWORK',
    3: 'MEDIA_ERR_DECODE',
    4: 'MEDIA_ERR_SRC_NOT_SUPPORTED'
  };

  function describe(el) {
    var src = el.currentSrc || el.getAttribute('src') || '';
    return 'src=' + src.slice(-60) + ' rs=' + el.readyState + ' ns=' + el.networkState +
           ' dur=' + (isFinite(el.duration) ? el.duration.toFixed(1) : '-') +
           ' t=' + el.currentTime.toFixed(2) + ' paused=' + el.paused;
  }

  function attach(el) {
    if (!el || el.__folioProbe) return;
    el.__folioProbe = true;
    probe.note('attach', describe(el));
    ['play', 'playing', 'pause', 'ended', 'waiting', 'stalled', 'suspend', 'emptied', 'abort',
     'loadstart', 'canplay', 'loadedmetadata'].forEach(function (name) {
      el.addEventListener(name, function () {
        if (name === 'play' || name === 'pause' || name === 'ended' || name === 'playing' ||
            name === 'abort' || name === 'emptied') {
          probe.note(name, describe(el));
        }
      }, true);
    });
    el.addEventListener('error', function () {
      var e = el.error;
      probe.note('ERROR', (e ? (ERROR_TEXT[e.code] || e.code) + ' ' + e.message : 'unknown') + ' | ' + describe(el));
    }, true);
  }

  function scan() {
    document.querySelectorAll('audio,video').forEach(attach);
  }

  // 播放失败最常见的落点是 play() 的 promise 被拒：AbortError（被新的 load 打断）、
  // NotSupportedError（源不可用）、NotAllowedError（手势限制）。
  var nativePlay = HTMLMediaElement.prototype.play;
  HTMLMediaElement.prototype.play = function () {
    var el = this;
    probe.note('play()', describe(el));
    var p;
    try { p = nativePlay.apply(this, arguments); } catch (e) {
      probe.note('play() threw', e && e.name);
      throw e;
    }
    if (p && p.catch) {
      p.catch(function (e) {
        probe.note('play() rejected', (e && e.name) + ' ' + (e && e.message));
      });
    }
    return p;
  };

  new MutationObserver(scan).observe(document.documentElement, { childList: true, subtree: true });
  document.addEventListener('DOMContentLoaded', scan);
  scan();

  // 自定义协议（folia://）下没有同源限制，音频地址能否真的取到字节只能自己探。
  // 播放「一闪就暂停」时，如果这里 HEAD 拿不到 200，就说明音频 CDN 被网络挡了，
  // 和播放器逻辑无关。
  var probed = {};
  probe.probeSrc = function (src) {
    if (!src || src.indexOf('blob:') === 0 || probed[src]) return;
    probed[src] = true;
    probe.note('probe-src', src.slice(0, 100));
    var xhr = new XMLHttpRequest();
    try {
      xhr.open('GET', src, true);
      xhr.responseType = 'arraybuffer';
      // 只取前 8KB 就够判断了，别把整首歌拉下来。
      xhr.setRequestHeader('Range', 'bytes=0-8191');
      xhr.onreadystatechange = function () {
        if (xhr.readyState !== 4) return;
        probe.note('probe-result', 'status=' + xhr.status +
          ' type=' + (xhr.getResponseHeader('Content-Type') || '-') +
          ' bytes=' + (xhr.response ? xhr.response.byteLength : 0));
      };
      xhr.onerror = function () { probe.note('probe-error', 'network'); };
      xhr.send();
    } catch (e) {
      probe.note('probe-threw', e && e.name);
    }
  };

  var lastSrc = '';
  setInterval(function () {
    var el = document.querySelector('audio');
    if (!el) return;
    var src = el.currentSrc || el.getAttribute('src') || '';
    if (src && src !== lastSrc) {
      lastSrc = src;
      probe.probeSrc(src);
    }
  }, 800);
})();
</script>
<!-- ========== 播放诊断探针 结束 ========== -->

<!-- ========== 播放中途被掐断后的自动续播 开始 ========== -->
<script>
// 系统层面有两个东西会在播放中途把声音掐掉，而页面自己不知道：
//   1. 来电 / 其他 App 抢占 → 音频会话被打断，WebAudio 静默；
//   2. 锁屏控制中心送来 playback 事件 → 同样的结果。
// 两种情况在 DOM 上看起来都只是「audio 被暂停了」，播放器状态机于是停在暂停。
//
// 这里只在「本来在放（已经放过一段时间、不是用户按的暂停、当前曲目没播完）」时续播一次，
// 并且限频，避免和用户手动暂停打架。
(function () {
  if (window.__folioAutoResume) return;
  var guard = window.__folioAutoResume = { enabled: true, attempts: 0 };

  var lastPlayedAt = 0;
  var stoppedAt = 0;
  var wasSounding = false;

  function currentAudio() {
    var list = document.querySelectorAll('audio');
    for (var i = 0; i < list.length; i += 1) {
      if (!list[i].paused && !list[i].ended) return list[i];
    }
    for (var j = 0; j < list.length; j += 1) {
      if (list[j].currentTime > 0 && !list[j].ended) return list[j];
    }
    return list[0] || null;
  }

  document.addEventListener('playing', function (e) {
    if (e.target && e.target.tagName === 'AUDIO') {
      wasSounding = true;
      lastPlayedAt = Date.now();
      guard.attempts = 0;
    }
  }, true);

  document.addEventListener('pause', function (e) {
    if (!e.target || e.target.tagName !== 'AUDIO') return;
    var el = e.target;
    // 播完了不算掐断；刚开播就停（用户手速/换歌）也不算。
    if (el.ended || el.currentTime < 1) return;
    if (Date.now() - lastPlayedAt < 500) return;
    wasSounding = true;
    stoppedAt = Date.now();
  }, true);

  function tryResume() {
    if (!guard.enabled || !wasSounding) return;
    if (Date.now() - stoppedAt < 300) return;
    if (guard.attempts >= 3) return;
    var el = currentAudio();
    if (!el || !el.paused || el.ended || !el.currentSrc) return;
    guard.attempts += 1;
    var p = el.play();
    if (p && p.catch) { p.catch(function () {}); }
    if (window.__folioAudioProbe) window.__folioAudioProbe.note('auto-resume', '#' + guard.attempts);
  }

  // 回到前台是最典型的「被打断后回来」场景。
  document.addEventListener('visibilitychange', function () {
    if (document.visibilityState === 'visible') { stoppedAt = 0; tryResume(); }
  });
  window.addEventListener('pageshow', function () { stoppedAt = 0; tryResume(); });
  window.addEventListener('focus', function () { stoppedAt = 0; tryResume(); });

  // 用户自己按暂停时先关掉守卫：点播放器按钮会先触发 pointerdown，
  // 比 pause 事件早，这样不会把用户的操作当成「被打断」。
  document.addEventListener('pointerdown', function (e) {
    var t = e.target;
    var el = t && t.closest ? t.closest('button,[role="button"]') : null;
    if (!el) return;
    var label = (el.getAttribute('aria-label') || '') + (el.getAttribute('data-testid') || '') + (el.textContent || '');
    if (/暂停|pause/i.test(label)) { guard.enabled = false; setTimeout(function () { guard.enabled = true; }, 1200); }
  }, true);
})();
</script>
<!-- ========== 播放中途被掐断后的自动续播 结束 ========== -->

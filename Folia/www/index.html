    <script>
      (function () {
        try {
          // 需要透明背景的入口不能盖遮罩：OBS 浏览器源会被直接推流捕获，
          // Electron 的透明播放背景 / 壁纸窗口（main.cjs 传 splash=0）会在桌面上闪一个黑块。
          var params = new URLSearchParams(window.location.search);
          if (params.get('obs') === '1' || window.location.pathname === '/obs' || params.get('splash') === '0') {
            var splash = document.getElementById('app-splash');
            if (splash) {
              splash.remove();
            }
            return;
          }
        } catch (error) {
          // 探测失败时保留遮罩，React 挂载后仍会移除它。
        }

        // 波形逐条随机化：高度、宽度、节奏、相位和颜色都带抖动，每次加载的形状都不一样。
        // 同步执行，在首帧绘制前完成；失败时 CSS 里的默认值会兜底成一条静态波形。
        try {
          var rand = function (min, max) {
            return min + Math.random() * (max - min);
          };

          var bars = document.querySelectorAll('#app-splash .app-splash-wave span');
          for (var i = 0; i < bars.length; i += 1) {
            var bar = bars[i];
            // 中间高、两端低的整体包络，再叠加随机量，形状既像波形又不规整。
            var envelope = Math.sin(((i + 0.5) / bars.length) * Math.PI);
            var peak = Math.min(1, 0.32 + envelope * rand(0.38, 0.72));
            bar.style.setProperty('--peak', peak.toFixed(3));
            bar.style.setProperty('--floor', rand(0.08, 0.24).toFixed(3));
            bar.style.setProperty('--w', rand(3.5, 6.5).toFixed(2) + 'px');
            // 白色平涂，只在亮度和辉光半径上留随机：高的条更亮、光晕更散。
            bar.style.setProperty('--alpha', rand(0.55, 1).toFixed(2));
            bar.style.setProperty('--glow', Math.round(rand(6, 26)) + 'px');
            bar.style.animationDuration = Math.round(rand(820, 1500)) + 'ms';
            bar.style.animationDelay = '-' + Math.round(rand(0, 1500)) + 'ms';
          }
        } catch (error) {
          // 随机化失败无所谓，CSS 默认值已经能跑一条波形。
        }

        // Folia 五个字母不断跳到不同字形（Loki 片头那种字体轮盘），偶尔整体落回基准样式。
        // 只用通用字族，再叠加字重、斜体和横向拉伸——不同机器上装的字体不一样，
        // 单靠字体名会退化成同一张脸，加上这几个轴才保证每次跳变都看得出来。
        try {
          if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
            return;
          }
          var BASE_FONT = "'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif";
          var FAMILIES = [BASE_FONT, 'serif', 'monospace', 'cursive', 'fantasy', 'system-ui'];
          var WEIGHTS = ['400', '600', '800'];
          var SCALES = [0.86, 0.94, 1, 1.06, 1.12];
          var letters = document.querySelectorAll('#app-splash .app-splash-title span');
          if (!letters.length) {
            return;
          }

          // 用 canvas 在 100px 基准下量出每个字母在所有候选字形里的最大宽度，换算成 em 写死盒子宽度，
          // 这样字形来回换、词标整体不会左右乱跳。
          var measure = document.createElement('canvas').getContext('2d');
          for (var m = 0; m < letters.length; m += 1) {
            var glyph = letters[m].textContent;
            var widest = 0;
            for (var f = 0; f < FAMILIES.length; f += 1) {
              measure.font = 'italic 800 100px ' + FAMILIES[f];
              widest = Math.max(widest, measure.measureText(glyph).width);
              measure.font = '800 100px ' + FAMILIES[f];
              widest = Math.max(widest, measure.measureText(glyph).width);
            }
            if (widest > 0) {
              // 余量留给最大的缩放组合（1.12 × 1.12），字形放大时不会压到相邻字母。
              letters[m].style.width = ((widest / 100) * 1.26 + 0.04).toFixed(3) + 'em';
            }
          }

          var pick = function (list) {
            return list[Math.floor(Math.random() * list.length)];
          };
          var jitter = function (min, max) {
            return min + Math.random() * (max - min);
          };
          // 辉光分三档：干净、微光、过曝。片头里字母亮度参差不齐，靠这个模拟。
          var randomGlow = function () {
            var roll = Math.random();
            if (roll < 0.3) {
              return '0 0 ' + (2 + Math.random() * 4).toFixed(1) + 'px rgba(255,255,255,0.35)';
            }
            if (roll < 0.75) {
              return '0 0 ' + (6 + Math.random() * 8).toFixed(1) + 'px rgba(255,255,255,0.7), 0 0 ' +
                (20 + Math.random() * 16).toFixed(1) + 'px rgba(255,255,255,0.35)';
            }
            return '0 0 ' + (10 + Math.random() * 8).toFixed(1) + 'px rgba(255,255,255,0.95), 0 0 ' +
              (34 + Math.random() * 20).toFixed(1) + 'px rgba(255,255,255,0.7), 0 0 ' +
              (70 + Math.random() * 40).toFixed(1) + 'px rgba(255,255,255,0.45)';
          };
          var timer = window.setInterval(function () {
            // 遮罩被移除后自己停掉，不留空转的定时器。
            if (!document.getElementById('app-splash')) {
              window.clearInterval(timer);
              return;
            }
            // 一拍只换一个字母，偶尔两个，节奏克制。
            var swaps = Math.random() < 0.25 ? 2 : 1;
            for (var i = 0; i < swaps; i += 1) {
              var letter = pick(letters);
              letter.style.fontFamily = pick(FAMILIES);
              letter.style.fontWeight = pick(WEIGHTS);
              letter.style.fontStyle = Math.random() < 0.25 ? 'italic' : 'normal';
              // 大小和宽窄都用 transform 做：不进入布局，盒子宽度不受影响，排版才不会抖。
              var sizeScale = jitter(0.86, 1.12);
              letter.style.transform =
                'scale(' + (sizeScale * pick(SCALES)).toFixed(3) + ',' + sizeScale.toFixed(3) + ')';
              letter.style.textShadow = randomGlow();
            }
          }, 380);
        } catch (error) {
          // 字体轮盘失败就保持静态词标。
        }
      })();
    </script>

    <script>
      (function () {
        var ua = navigator.userAgent || '';
        if (!/iPhone|iPad|iPod/i.test(ua)) return;
        var root = document.documentElement;
        root.setAttribute('data-folia-ios', '1');
        // 装进壳里（Capacitor WKWebView / 原生壳）时，安全区由壳实测后推过来：
        // 页面铺满整屏，界面按实测值内缩，不再自己算机型表、也不再整页缩 86%。
        if (window.Capacitor || navigator.standalone === true || /FoliaApp|FoliaNative/i.test(ua)) {
          root.setAttribute('data-folia-shell', '1');
        }

        // 屏高 → 上下安全区（逻辑像素）。UA 与 CSS 尺寸一致时这两张表与真机 env() 值相等，
        // 用来在 env() 还没就绪时给一个正确值，避免内容被状态栏盖住或底部多出一截黑边。
        function insetsFor(width, height, dpr) {
          var short = Math.min(width, height);
          // iPad：上下各 24pt
          if (/iPad/i.test(ua) || short >= 744) return { top: 24, bottom: 20 };
          // 带灵动岛 / 刘海的机型
          if (short >= 440) return { top: 62, bottom: 34 }; // 17 Pro Max 等 6.9"
          if (short >= 402) return { top: 62, bottom: 34 }; // 16 Pro / 17 Pro
          if (short >= 393) return { top: 59, bottom: 34 }; // 15 / 16 / 14 Pro
          if (short >= 390) return { top: 47, bottom: 34 }; // 12 / 13 / 14 非 Pro
          if (short >= 375) return { top: 47, bottom: 34 }; // X / XS / 11 Pro / mini 系列
          if (short >= 360 && dpr >= 3) return { top: 44, bottom: 34 }; // 8 Plus 等
          return { top: 20, bottom: 0 }; // SE / 8 及更早：有状态栏、无 Home 条
        }

        function measured() {
          var w = window.innerWidth || root.clientWidth;
          var h = window.innerHeight || root.clientHeight;
          var dpr = window.devicePixelRatio || 1;
          // visualViewport 高度会扣掉浏览器栏；壳内是全屏，取较大者更接近屏幕尺寸
          var vv = window.visualViewport;
          if (vv && vv.height > h) h = vv.height;
          return insetsFor(w, h, dpr);
        }

        function probeEnv() {
          var probe = document.getElementById('folia-safe-probe');
          if (!probe) {
            probe = document.createElement('div');
            probe.id = 'folia-safe-probe';
            probe.style.cssText = 'position:fixed;left:0;top:0;width:0;height:0;visibility:hidden;pointer-events:none;'
              + 'padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);'
              + 'padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px);';
            document.body.appendChild(probe);
          }
          var s = window.getComputedStyle(probe);
          return {
            top: parseFloat(s.paddingTop) || 0,
            bottom: parseFloat(s.paddingBottom) || 0,
            left: parseFloat(s.paddingLeft) || 0,
            right: parseFloat(s.paddingRight) || 0
          };
        }

        // 手机上把整页缩到 86%（见上面的 CSS）：只在 iPhone 这种窄屏上做，iPad 与桌面版不动。
        // 壳里不做整页缩放：缩完四周必然留一圈底色，就是用户说的那种黑边。
        function decideCompact() {
          var w = window.innerWidth || root.clientWidth;
          var shell = root.getAttribute('data-folia-shell') === '1';
          var phone = !shell && !/iPad/i.test(ua)
            && Math.min(w, window.innerHeight || root.clientHeight) < 560;
          if (phone) root.setAttribute('data-folia-compact', '1');
          else root.removeAttribute('data-folia-compact');
        }

        function apply() {
          var envValue = probeEnv();
          var guess = measured();
          var top = envValue.top || guess.top;
          var bottom = envValue.bottom || guess.bottom;
          // 壳（FoliaWebShell）会把 WKWebView 实测的安全区推过来，见下面的 folia-safe-insets。
          // 原生壳里 WebKit 的自动 inset 已关掉，env() 与机型表都可能偏，实测值是唯一可靠的一档。
          // 机型表量的是「从屏幕物理边缘到安全区」，而壳里 #root 是裁剪掉窗口圆角后的盒子，
          // 两者可能差几个 pt，所以壳给了值就整份采用。
          var shell = window.__foliaSafeInsets;
          if (shell && typeof shell.top === 'number') {
            var clamped = function (v) {
              return Math.max(0, Math.min(120, Math.round(v) || 0));
            };
            root.style.setProperty('--folia-safe-top', clamped(shell.top) + 'px');
            root.style.setProperty('--folia-safe-bottom', clamped(shell.bottom) + 'px');
            root.style.setProperty('--folia-safe-left', clamped(shell.left || 0) + 'px');
            root.style.setProperty('--folia-safe-right', clamped(shell.right || 0) + 'px');
            root.setAttribute('data-folia-safe', 'shell');
            return;
          }
          root.removeAttribute('data-folia-safe');
          root.style.setProperty('--folia-safe-top', top + 'px');
          root.style.setProperty('--folia-safe-bottom', bottom + 'px');
          root.style.setProperty('--folia-safe-left', (envValue.left || 0) + 'px');
          root.style.setProperty('--folia-safe-right', (envValue.right || 0) + 'px');
        }

        apply();
        decideCompact();
        // 壳注入安全区之后要再排一次：注入时机可能在首次 apply 之后。
        window.addEventListener('folia-safe-insets', apply);
        window.addEventListener('resize', apply);
        window.addEventListener('orientationchange', apply);
        if (window.visualViewport) window.visualViewport.addEventListener('resize', apply);
        document.addEventListener('DOMContentLoaded', function () {
          apply();
          decideCompact();
        });

        // 扫码登录的图片：npm 版接口回的是完整 dataURL，某些代理/自建服务只回裸 base64，
        // <img> 拿到裸 base64 会显示空白。这里补上 data: 前缀，PNG/JPEG 按魔数判断。
        var BASE64_ONLY = /^[A-Za-z0-9+/=\r\n]+$/;
        function fixImage(img) {
          if (!img || img.getAttribute('data-folia-b64') === '1') return;
          var src = (img.getAttribute('src') || '').trim();
          if (!src || src.indexOf('data:') === 0 || src.length < 512 || !BASE64_ONLY.test(src)) return;
          var mime = src.slice(0, 4).indexOf('/9j/') === 0 ? 'image/jpeg' : 'image/png';
          img.setAttribute('src', 'data:' + mime + ';base64,' + src.replace(/[\r\n]/g, ''));
          img.setAttribute('data-folia-b64', '1');
        }
        function sweep() {
          var imgs = document.querySelectorAll('img');
          for (var i = 0; i < imgs.length; i += 1) fixImage(imgs[i]);
        }
        new MutationObserver(sweep).observe(root, { subtree: true, childList: true, attributes: true, attributeFilter: ['src'] });
      })();
    </script>

<script>
// NeteaseCloudMusicApi 的 /lyric/new 会把 lrc.lyric 拼成「混合体」：
// 除前几行是 {"t":0,"c":[{"tx":"作词: "},...]} 这样的逐字 JSON 外，
// 后面全是普通 LRC 行。播放器只会按 LRC 解析，遇到 JSON 那几行就直接报错，
// 结果整首歌一句歌词都显示不出来（表现为「网易云没歌词」）。
// 这里在 fetch/XHR 层把响应改写成第二行起那种纯 LRC 文本。
(function () {
  if (window.__foliaLyricFixInstalled) return;
  window.__foliaLyricFixInstalled = true;

  var hasOwn = Object.prototype.hasOwnProperty;

  function parseLine(line) {
    var text = line.trim();
    if (!text || text.charAt(0) !== '{') return null;
    try {
      var obj = JSON.parse(text);
      if (!obj || typeof obj.t !== 'number' || !Array.isArray(obj.c)) return null;
      var content = '';
      for (var i = 0; i < obj.c.length; i++) {
        if (obj.c[i] && typeof obj.c[i].tx === 'string') content += obj.c[i].tx;
      }
      return { t: obj.t, text: content };
    } catch (e) {
      return null;
    }
  }

  function lrcTime(ms) {
    if (ms < 0) ms = 0;
    var centis = Math.floor(ms % 1000 / 10);
    var totalSec = Math.floor(ms / 1000);
    var mm = Math.floor(totalSec / 60);
    var ss = totalSec % 60;
    return '[' + (mm < 10 ? '0' + mm : mm) + ':' + (ss < 10 ? '0' + ss : ss) + '.' +
      (centis < 10 ? '0' + centis : centis) + ']';
  }

  function convert(text) {
    var lines = text.split('\n');
    var touched = false;
    for (var i = 0; i < lines.length; i++) {
      var parsed = parseLine(lines[i]);
      if (!parsed) continue;
      touched = true;
      lines[i] = lrcTime(parsed.t) + parsed.text;
    }
    return touched ? lines.join('\n') : text;
  }

  function fixJson(payload) {
    if (!payload || typeof payload !== 'object') return payload;
    var source = payload;
    if (!payload.lrc && payload.data && payload.data.lrc) source = payload.data;
    var lrc = source.lrc;
    if (!lrc || typeof lrc.lyric !== 'string') return payload;
    var next = convert(lrc.lyric);
    if (next === lrc.lyric) return payload;
    lrc.lyric = next;
    return payload;
  }

  // 只处理网易歌词接口，其它请求一律走原生实现。
  function isTarget(url) {
    return typeof url === 'string' && url.indexOf('/lyric/new') >= 0;
  }

  var nativeFetch = window.fetch;
  if (typeof nativeFetch === 'function') {
    window.fetch = function (input, init) {
      var url = typeof input === 'string' ? input : input && input.url;
      var result = nativeFetch.apply(this, arguments);
      if (!isTarget(url)) return result;
      return result.then(function (response) {
        return response.text().then(function (text) {
          var fixed = text;
          try { fixed = JSON.stringify(fixJson(JSON.parse(text))); } catch (e) {}
          var body = new Response(fixed, {
            status: response.status,
            statusText: response.statusText,
            headers: response.headers
          });
          return body;
        }, function () { return response; });
      });
    };
  }

  var nativeOpen = XMLHttpRequest.prototype.open;
  var nativeSend = XMLHttpRequest.prototype.send;
  XMLHttpRequest.prototype.open = function (method, url) {
    this.__foliaLyricUrl = url;
    return nativeOpen.apply(this, arguments);
  };
  XMLHttpRequest.prototype.send = function () {
    var xhr = this;
    if (isTarget(xhr.__foliaLyricUrl)) {
      xhr.addEventListener('readystatechange', function () {
        if (xhr.readyState !== 4 || xhr.status !== 200) return;
        if (hasOwn.call(xhr, '__foliaFixed')) return;
        xhr.__foliaFixed = true;
        var text = '';
        try { text = xhr.responseText; } catch (e) { return; }
        var fixed = text;
        try { fixed = JSON.stringify(fixJson(JSON.parse(text))); } catch (e) { return; }
        Object.defineProperty(xhr, 'responseText', { value: fixed, configurable: true });
        Object.defineProperty(xhr, 'response', {
          value: xhr.responseType === 'json' ? JSON.parse(fixed) : fixed,
          configurable: true
        });
      }, true);
    }
    return nativeSend.apply(this, arguments);
  };
})();
</script>

  function maskBit(mask, x, y) {

  // 关键点：行号跨过功能图形时要继续原来方向前进（不是每列对重新从头扫），
  // 只有整列对走完才反转方向。第 6 列是定时图形，整列跳过。

      else grid[size - 15 + i][8] = bit;

      for (var x = 0; x < size - 1; x += 1) {

  // 功能图形模板：定位图形、分隔带、定时图形、校正图形、格式信息与版本信息预留区。

  function qrTemplate(version) {

  }
  function finder(ox, oy) {
    for (var fy = -1; fy <= 7; fy += 1) {

  for (var i = 8; i < size - 8; i += 1) {
    grid[6][i] = i % 2 ? 0 : 1;
    grid[i][6] = i % 2 ? 0 : 1;
  }
  // 校正图形：跳过与三个定位图形重叠的三个角
  var centres = alignmentCentres(version);
  for (var a = 0; a < centres.length; a += 1) {
    for (var b = 0; b < centres.length; b += 1) {

  function qrImage(text) {

      + '" viewBox="0 0 ' + total + ' ' + total + '"><rect width="' + total + '" height="' + total
      + '" fill="#fff"/><path fill="#111" d="' + path + '"/></svg>';

  function profile(provider, state) {
    return {
      id: state.userId,
      userId: state.userId,
      nickname: state.nickname,
      avatarUrl: '',
      vipType: 0
    };
  }

  function answer(provider, route) {
    var state = load(provider.id);
    if (route === 'login_channels') {
      // QQ 登录方式：只报 qq + wechat 两个渠道，界面就会出两个按钮让用户选。
      // 一旦报上 qqmusic，前端会认为可以直连、把选择器整个隐藏掉。
      if (provider.id === 'qq') return { code: 200, data: { channels: ['qq', 'wechat'], sessionMode: 'normal' } };
      return { code: 200, data: { channels: [], sessionMode: 'normal' } };
    }
    if (route === 'login_qr_key') {
      state.key = provider.id + '-' + Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
      state.createdAt = Date.now();
      save(provider.id, state);
      return { code: 200, data: { unikey: state.key, key: state.key } };

      var image = qrImage(QR_TEXT[provider.id] || provider.id);
      return { code: 200, data: { qrimg: image, imageUrl: image, qrcode: image, base64: image, url: image } };
    }
    if (route === 'login_qr_check') {
      if (!state.userId) {
        state.userId = String(9e8 + Math.floor(Math.random() * 9e7));

      save(provider.id, state);

        status: 4,

          status: 4,
          token: 'offline-' + provider.id,

          profile: profile(provider, state)

        profile: profile(provider, state)

    }
    if (route === 'login_status') {
      if (!state.userId) return { code: 301, data: null };
      return {
        code: 200,
        data: {
          code: 200,
          status: 4,
          token: 'offline-' + provider.id,
          profile: profile(provider, state)
